function itemsView(m){m.innerHTML=`<div class="card"><h3>Item Master</h3>

 });

 document.querySelectorAll("[data-user-delete]").forEach(btn=>btn.onclick=async()=>{const x=docs.find(v=>v.id===btn.dataset.userDelete);if(!confirm(`Delete/disable ${x.displayName||x.username}? Historical audit records will remain.`))return;await addDoc(collection(db,"userAudit"),{targetUid:x.id,action:"deleted_profile",oldRole:x.role,displayName:x.displayName||x.username,createdAt:serverTimestamp(),createdBy:me.uid});await setDoc(doc(db,"users",x.id),{active:false,deleted:true,deletedAt:serverTimestamp(),deletedBy:me.uid},{merge:true});render("users")});
}

onAuthStateChanged(auth,async u=>{
 if(!u){if(await isBootstrapped())return login();return firstSetup();}
 try{await profile(u);shell();sub()}catch{await signOut(auth);login("Inactive or missing profile")}
});
if("serviceWorker"in navigator){
 navigator.serviceWorker.register("./sw.js").then(r=>r.update()).catch(e=>console.warn("Service worker:",e));
}
</script></body></html>
