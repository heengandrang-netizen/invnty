<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#F6F1E7">
<link rel="manifest" href="manifest.json"><title>StockSync Pro — Ledger v14</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
/* StockSync Pro — Warm Ivory (light) theme: cream canvas, sage as the primary action color,
   bronze as the secondary accent — the app's original palette, refined into one clean stylesheet. */
:root{
 --canvas:#F6F1E7;--surface:#FFFEFB;--surface-2:#F1EADA;
 --line:#E4D9C5;--line-soft:#EDE5D4;
 --ink:#241F17;--muted:#7C7364;--muted-2:#A39A87;
 --sage:#4F7566;--sage-deep:#3E5C50;
 --gold:#A97B48;--gold-deep:#8C633A;
 --success:#2F8A63;--success-bg:#E9F3ED;
 --danger:#B9555A;--danger-bg:#F8ECEC;
 --warning:#B8792E;--warning-bg:#FBF0E1;
 --shadow:0 20px 46px rgba(75,58,30,.10);--shadow-sm:0 8px 22px rgba(75,58,30,.07);
}
*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:#D6C9AE transparent}
html{background:var(--canvas);scroll-behavior:smooth}
body{margin:0;font-family:'Manrope',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
 color:var(--ink);background:var(--canvas);min-height:100vh;letter-spacing:-.003em}
body:before{content:"";position:fixed;inset:0 0 auto 0;height:440px;pointer-events:none;z-index:0;
 background:radial-gradient(640px 320px at 8% -12%,rgba(169,123,72,.09),transparent 65%),
            radial-gradient(580px 300px at 94% -8%,rgba(79,117,102,.07),transparent 65%)}
.app{max-width:1600px;margin:0 auto;padding:20px 26px 40px;position:relative;z-index:1}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grow{flex:1;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;
 box-shadow:var(--shadow-sm);transition:border-color .18s,box-shadow .18s}
.card:hover{border-color:#D8CBB0;box-shadow:var(--shadow)}
.card h3{margin:0 0 15px;font-size:15.5px;font-weight:700;letter-spacing:-.01em;color:var(--ink);display:flex;align-items:center;gap:9px}
.card h3:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px rgba(169,123,72,.14)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:13px}
button,input,select,textarea{font:inherit;outline:none}
input,select,textarea{min-height:43px;background:var(--surface-2);color:var(--ink);border:1px solid var(--line);
 border-radius:11px;padding:10px 13px;transition:.16s}
input::placeholder,textarea::placeholder{color:var(--muted-2)}
input:focus,select:focus,textarea:focus{border-color:var(--sage);box-shadow:0 0 0 3px rgba(79,117,102,.16)}
button{min-height:41px;border:1px solid transparent;border-radius:11px;padding:9px 16px;
 background:linear-gradient(135deg,var(--sage),var(--sage-deep));color:#fff;font-weight:750;cursor:pointer;
 box-shadow:0 6px 16px rgba(79,117,102,.20);transition:.16s}
button:hover{transform:translateY(-1px);box-shadow:0 10px 22px rgba(79,117,102,.28)}
button:active{transform:none}
button.secondary{background:var(--surface-2);color:var(--ink);border-color:var(--line);box-shadow:none}
button.secondary:hover{background:#E8DFC9;box-shadow:none}
button.danger{background:linear-gradient(135deg,var(--danger),#A34448);color:#fff}
.danger-soft{background:var(--danger-bg);color:var(--danger);border:1px solid rgba(185,85,90,.28);box-shadow:none}
.good{color:var(--success)}.bad{color:var(--danger)}.warn{color:var(--warning)}
.brand{font-size:21px;font-weight:800;letter-spacing:-.02em;color:var(--ink)}.brand span{color:var(--gold);letter-spacing:.05em}
.muted{color:var(--muted);font-size:12.5px;line-height:1.5}
.kpi{font-size:30px;font-weight:800;letter-spacing:-.03em;margin-top:6px;color:var(--ink);font-variant-numeric:tabular-nums}
.grid>.card{min-height:112px;position:relative;overflow:hidden;padding-left:22px}
.grid>.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--sage),var(--gold));opacity:.9}
.grid>.card:after{content:"";position:absolute;width:90px;height:90px;right:-36px;top:-36px;border-radius:50%;
 background:radial-gradient(circle,rgba(169,123,72,.08),transparent 70%)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--success-bg);color:var(--success);
 border:1px solid rgba(47,138,99,.25);border-radius:999px;padding:6px 11px;font-size:11.5px;font-weight:700}
.pill:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--success)}
.topbar{min-height:60px;padding:2px 2px 16px;border-bottom:1px solid var(--line-soft)}
.brand-mark{display:inline-flex;align-items:center;gap:12px}
.logo-dot{width:38px;height:38px;border-radius:12px;background:linear-gradient(145deg,var(--sage),var(--sage-deep) 45%,var(--gold));
 box-shadow:0 8px 20px rgba(79,117,102,.24),inset 0 0 0 1px rgba(255,255,255,.10);position:relative}
.logo-dot:after{content:"";position:absolute;width:10px;height:10px;border:2.5px solid rgba(255,255,255,.9);border-top-color:transparent;
 border-radius:50%;left:11px;top:11px;transform:rotate(25deg)}
.user-meta{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-top:2px}
.role-chip{font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:capitalize;padding:3px 9px;border-radius:999px;
 background:rgba(169,123,72,.12);color:var(--gold);border:1px solid rgba(169,123,72,.28)}
.scroll{overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;min-width:680px}
th,td{padding:12px 14px;border-bottom:1px solid var(--line-soft);text-align:left;vertical-align:middle}
th{position:sticky;top:0;background:#F3EBDA;color:var(--muted);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;z-index:2}
td{color:var(--ink)}table b{color:var(--ink)}tr:last-child td{border-bottom:0}tbody tr:hover td{background:var(--surface-2)}
.login{max-width:445px;margin:9vh auto;padding:32px;border-radius:22px;background:var(--surface);border:1px solid var(--line);
 box-shadow:0 26px 60px rgba(75,58,30,.14)}
.login:before{content:"";display:block;width:40px;height:5px;border-radius:9px;background:linear-gradient(90deg,var(--sage),var(--gold));margin-bottom:20px}
.login .brand{font-size:29px}.login input{width:100%;margin:6px 0;min-height:49px}.login button{min-height:49px}
.bar{height:6px;background:var(--surface-2);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sage),var(--gold))}
#main{animation:fadeUp .2s ease}@keyframes fadeUp{from{opacity:.3;transform:translateY(4px)}to{opacity:1;transform:none}}
button:focus-visible,input:focus-visible,select:focus-visible,[data-tab]:focus-visible{outline:2.5px solid var(--sage);outline-offset:2px}
.icon-btn{min-width:42px;padding:9px 12px}
.section-title{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:6px 2px 12px}
.stat-label{color:var(--muted);font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.status-chip{display:inline-flex;align-items:center;border-radius:999px;padding:5px 10px;font-size:10.5px;font-weight:700;
 background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.status-chip.good-bg{background:var(--success-bg);color:var(--success);border-color:rgba(47,138,99,.28)}
.status-chip.bad-bg{background:var(--danger-bg);color:var(--danger);border-color:rgba(185,85,90,.28)}
.status-chip.warn-bg{background:var(--warning-bg);color:var(--warning);border-color:rgba(184,121,46,.28)}
.progress-wrap{height:7px;background:var(--surface-2);border-radius:8px;overflow:hidden}
.progress-fill{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--sage),var(--gold));transition:width .25s}
.premium-hero{position:relative;overflow:hidden;min-height:84px;padding:20px 24px;border-radius:20px;
 background:linear-gradient(120deg,#FFFEFB 0%,#F8F1E2 55%,#F4EBDC 100%);border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.premium-hero:after{content:"";position:absolute;width:200px;height:200px;border-radius:50%;right:-60px;top:-110px;
 background:radial-gradient(circle,rgba(169,123,72,.10),transparent 70%)}
.hero-title{font-size:14.5px;font-weight:700;color:var(--ink)}.hero-sub{font-size:12px;color:var(--muted)}
.hero-badge{display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;background:var(--surface-2);
 border:1px solid var(--line);font-size:11px;font-weight:700;color:var(--ink);white-space:nowrap}
.hero-badge i{width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 0 4px rgba(47,138,99,.16)}
.count-entry{transition:.16s;border-radius:16px}
.count-entry.is-pending{border-left:3px solid var(--sage)}.count-entry.is-done{opacity:.68;border-left:3px solid var(--success)}
.action-strip{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 0 2px}
.empty{padding:28px;text-align:center;color:var(--muted-2);background:var(--surface-2);border:1px dashed var(--line);border-radius:12px}
.workspace-shell{display:grid;grid-template-columns:238px minmax(0,1fr);gap:24px;align-items:start;width:100%;margin-top:20px}
.workspace-shell>nav{position:sticky;top:20px;display:flex;flex-direction:column;width:238px;padding:10px;
 border:1px solid var(--line);border-radius:18px;background:rgba(255,254,251,.92);backdrop-filter:blur(14px);box-shadow:var(--shadow-sm)}
.workspace-shell>nav button{display:block;width:100%;min-height:43px;text-align:left;margin:1px 0;padding:11px 14px;
 background:transparent;color:var(--muted);border:0;box-shadow:none;font-weight:650;border-radius:10px;transition:background .15s,color .15s}
.workspace-shell>nav button:hover{background:var(--surface-2);color:var(--ink)}
.workspace-shell>nav button.active{position:relative;background:rgba(79,117,102,.12);color:var(--sage-deep)}
.workspace-shell>nav button.active:before{content:"";position:absolute;left:2px;top:9px;bottom:9px;width:3px;border-radius:5px;background:var(--gold)}
.workspace-content{display:block;min-width:0;width:100%}
.workspace-content>.premium-hero{margin:0 0 16px}
.workspace-content>main{display:block;width:100%;min-width:0}
.workspace-content>main>.grid{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:1099px){
 .app{padding:16px 16px 32px}
 .workspace-shell{display:block;margin-top:14px}
 .workspace-shell>nav{position:static;width:100%;display:flex;flex-direction:row;overflow-x:auto;margin:0 0 14px;padding:8px}
 .workspace-shell>nav button{width:auto;min-width:max-content;text-align:center}
}
@media(max-width:700px){
 .app{padding:12px 12px 88px}.topbar .user-meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
 #net{display:none}.card{border-radius:16px;padding:15px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
 .grid>.card{min-height:98px}.kpi{font-size:25px}.brand{font-size:19px}
 .workspace-shell{margin-top:10px}
 .workspace-shell>nav{position:fixed;left:8px;right:8px;bottom:8px;top:auto;z-index:60;overflow-x:auto;box-shadow:0 16px 40px rgba(75,58,30,.20)}
 .premium-hero{padding:15px 16px;border-radius:17px}.hero-title{font-size:13px}.hero-badge{display:none}
 table{font-size:12px}.scroll{border-radius:12px}.login{margin:6vh 8px;padding:24px}
 .count-entry .action-strip{display:grid;grid-template-columns:1.4fr 1fr 1fr;width:100%}.count-entry .action-strip button{width:100%}
}
@media(max-width:390px){.grid{grid-template-columns:1fr 1fr}.kpi{font-size:22px}.stat-label{font-size:9px}}
</style></head><body><div id="app" class="app"></div>

<script type="module">
import{initializeApp,deleteApp}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import{getFirestore,collection,doc,getDoc,getDocs,setDoc,addDoc,updateDoc,onSnapshot,query,orderBy,serverTimestamp,writeBatch,limit,where}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
import{firebaseConfig}from"./firebase-config.js";
const fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getFirestore(fb),$=s=>document.querySelector(s),app=$("#app");
let me=null,items=[],latest={},actual={},movements=[],sessions=[],variances=[],imports=[],countEntries=[],recounts=[],unsubs=[];
let searchQ={items:"",dashboard:"",reports:"",movement:"",variance:""};
function clearSubs(){unsubs.forEach(fn=>{try{fn()}catch{}});unsubs=[]}
const tabs={master:["dashboard","items","tally","counts","actual","movement","variance","reports","users"],actual:["actual"],tally:["tally"]};
const L={dashboard:"Dashboard",items:"Items & Aliases",tally:"Tally Upload",counts:"Count Sessions",actual:"Actual Count",movement:"IN / OUT",variance:"Variance",reports:"Reports",users:"Users"};
const esc=(x="")=>String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const dt=v=>{try{return v?.toDate?.().toLocaleString()||"-"}catch{return"-"}}, num=x=>Number(x||0), hasComparison=id=>actual[id]?.qty!=null&&latest[id]?.qty!=null, dif=id=>hasComparison(id)?num(actual[id]?.qty)-num(latest[id]?.qty):null;
function matchItem(i,q){if(!q)return true;q=q.trim().toLowerCase();return i.name.toLowerCase().includes(q)||(i.aliases||[]).some(a=>String(a).toLowerCase().includes(q))}
function normKey(x){return String(x).trim().toLowerCase().replace(/[\s\-\u2010-\u2015_./]+/g," ").trim()}
function searchBox(id,val,ph="Search item or alias..."){return `<input id="${id}" placeholder="${esc(ph)}" class="grow" value="${esc(val)}" autocomplete="off">`}

function loginIdFromName(name){
 return name.trim().toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9._-]+/g,".").replace(/^\.+|\.+$/g,"");
}
async function isBootstrapped(){
 try{return (await getDoc(doc(db,"system","bootstrap"))).exists()}catch{return true}
}
async function firstSetup(msg=""){
 app.innerHTML=`<div class="login card"><div class="brand">Welcome to StockSync Pro</div>
 <p class="muted" style="margin:8px 0 18px">First-time setup · Create the Master account to continue.</p>
 <input id="setupName" placeholder="Master name" autocomplete="name">
 <input id="setupPin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="12" placeholder="Create PIN">
 <input id="setupPin2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="12" placeholder="Confirm PIN">
 <button id="setupGo" style="width:100%;margin-top:8px">Create Master & Continue</button>
 <p class="bad">${esc(msg)}</p><p class="muted">This setup is available only until the first Master is created.</p></div>`;
 $("#setupGo").onclick=async()=>{
   let name=$("#setupName").value.trim(),pin=$("#setupPin").value.trim(),pin2=$("#setupPin2").value.trim(),id=loginIdFromName(name);
   if(!id)return firstSetup("Enter a valid Master name");
   if(!/^\d{6,12}$/.test(pin))return firstSetup("Use a 6–12 digit PIN");
   if(pin!==pin2)return firstSetup("PINs do not match");
   $("#setupGo").disabled=true; $("#setupGo").textContent="Creating Master…";
   try{
     if(await isBootstrapped()) return login("Master setup is already complete. Please login.");
     let cred=await createUserWithEmailAndPassword(auth,id+"@inventory.local",pin);
     let b=writeBatch(db);
     b.set(doc(db,"users",cred.user.uid),{username:id,displayName:name,role:"master",active:true,createdAt:serverTimestamp(),createdBy:cred.user.uid});
     b.set(doc(db,"system","bootstrap"),{initialized:true,masterUid:cred.user.uid,createdAt:serverTimestamp()});
     await b.commit();
     // auth state listener will load the new Master profile automatically
   }catch(e){
     try{await signOut(auth)}catch{}
     firstSetup(e?.code==="auth/email-already-in-use"?"This Master name is already in use. Choose another name or login.":"Could not create Master. Ensure Email/Password Authentication and Firestore are enabled, then retry.");
   }
 };
}
function login(msg=""){app.innerHTML=`<div class="login card"><div class="brand">StockSync Pro</div><p class="muted" style="margin:7px 0 18px">Inventory Audit & Reconciliation</p><input id="u" placeholder="Name" autocomplete="username" style="width:100%;margin:5px 0"><input id="p" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="current-password" placeholder="PIN" maxlength="12" style="width:100%;margin:5px 0"><button id="go" style="width:100%;margin-top:8px">Secure Login</button><p class="muted" style="text-align:center;margin:12px 0 0">Enter your name and PIN</p><p class="bad">${esc(msg)}</p></div>`;$("#go").onclick=async()=>{try{let name=$("#u").value.trim().toLowerCase(), pin=$("#p").value.trim();
if(!name||!/^\d{6,12}$/.test(pin))return login("Enter your name and a 6–12 digit PIN");
let loginId=loginIdFromName(name);
if(!loginId)return login("Please enter a valid name");
await signInWithEmailAndPassword(auth,loginId+"@inventory.local",pin)}catch{login("Invalid username or PIN")}}}
async function profile(u){let s=await getDoc(doc(db,"users",u.uid));if(!s.exists()||s.data().active===false)throw 0;me={uid:u.uid,...s.data()}}
function shell(){let a=tabs[me.role]||[];app.classList.toggle("master-shell",me.role==="master");app.innerHTML=`<div class="row topbar"><div class="grow"><div class="brand-mark"><span class="logo-dot"></span><div><div class="brand">StockSync Pro <span style="font-size:10px;vertical-align:top;font-weight:800">LEDGER</span></div><div class="user-meta">${esc(me.displayName||me.username)}<span class="role-chip">${esc(me.role)}</span></div></div></div></div><span class="pill" id="net">${navigator.onLine?"Synced ✓":"Offline"}</span><button class="secondary" id="out">Logout</button></div><div class="workspace-shell"><nav>${a.map((x,i)=>`<button data-tab="${x}" class="${i?"":"active"}">${L[x]}</button>`).join("")}</nav>
<div class="workspace-content"><div class="premium-hero"><div><div class="hero-title">${me.role==="master"?"Inventory overview & control":me.role==="actual"?"Physical stock workspace":"Tally stock workspace"}</div>
<div class="hero-sub">${me.role==="master"?"Live reconciliation, counting and audit visibility in one workspace.":me.role==="actual"?"Fast blind counting with automatic unit conversion.":"Upload and validate Tally inventory safely."}</div></div>
<div class="hero-badge"><i></i>${navigator.onLine?"Live sync":"Offline mode"}</div></div><main id="main"></main></div></div>`;$("#out").onclick=async()=>{clearSubs();await signOut(auth)};document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-tab]").forEach(x=>x.classList.remove("active"));b.classList.add("active");render(b.dataset.tab)});render(a[0]);}
addEventListener("online",()=>{$("#net")&&($("#net").textContent="Synced ✓")});addEventListener("offline",()=>{$("#net")&&($("#net").textContent="Offline")});
function sub(){clearSubs();const listen=(ref,ok,label)=>unsubs.push(onSnapshot(ref,ok,e=>console.warn(label,e.code)));
listen(collection(db,"items"),x=>{items=x.docs.map(d=>({id:d.id,...d.data()}));refresh()},"items");
if(me.role==="master"||me.role==="tally")listen(collection(db,"stockLatest"),x=>{latest=Object.fromEntries(x.docs.map(d=>[d.id,d.data()]));refresh()},"stockLatest");
if(me.role==="master"||me.role==="actual")listen(collection(db,"actualLatest"),x=>{actual=Object.fromEntries(x.docs.map(d=>[d.id,d.data()]));refresh()},"actualLatest");
if(me.role==="master"||me.role==="actual")listen(collection(db,"countSessions"),x=>{sessions=x.docs.map(d=>({id:d.id,...d.data()}));refresh()},"countSessions");
if(me.role==="master"||me.role==="actual")listen(collection(db,"countEntries"),x=>{countEntries=x.docs.map(d=>({id:d.id,...d.data()}));refresh()},"countEntries");
if(me.role==="master"||me.role==="actual")listen(collection(db,"recountRequests"),x=>{recounts=x.docs.map(d=>({id:d.id,...d.data()}));refresh()},"recountRequests");
if(me.role==="master"||me.role==="tally")listen(query(collection(db,"tallyImports"),orderBy("createdAt","desc"),limit(100)),x=>{imports=x.docs.map(d=>({id:d.id,...d.data()}));refresh()},"tallyImports");

function previewTally(grid,fileName,hash){
let nc=$("#nc").value,qc=$("#qc").value,qc2=$("#qc2").value,hasHeader=$("#hasHeader").checked;
if(nc==="")return alert("Select the item name column.");
if(qc==="")return alert("Select the primary quantity column.");
nc=+nc;qc=+qc;qc2=qc2===""?null:+qc2;
let start=hasHeader?1:0;
let norm=normKey,map=new Map(),ambiguous=new Set();
items.forEach(i=>[i.name,...(i.aliases||[])].forEach(a=>{let k=norm(a);if(map.has(k)&&map.get(k).id!==i.id)ambiguous.add(k);else map.set(k,i)}));
let seen=new Set(),p=[];
for(let r=start;r<grid.length;r++){
 let row=grid[r],raw=row[nc]?String(row[nc].v).trim():"";
 if(!raw)continue;
 let key=norm(raw),dup=seen.has(key),amb=ambiguous.has(key);
 seen.add(key);
 let it=(dup||amb)?null:map.get(key);
 let c1=row[qc],c2=qc2!=null?row[qc2]:null;
 let v1=c1&&c1.v!==""?Number(c1.v):null,v2=c2&&c2.v!==""?Number(c2.v):null;
 v1=Number.isFinite(v1)?v1:null;v2=Number.isFinite(v2)?v2:null;
 let u1=c1?c1.unit:"",u2=c2?c2.unit:"";
 let baseQty=null,baseUnit="",packQty=null,packUnit="",packSize=null;
 if(v1!=null&&v2!=null&&v1!==0&&v2!==0){
   if(Math.abs(v1)>=Math.abs(v2)){baseQty=v1;baseUnit=u1;packQty=v2;packUnit=u2}
   else{baseQty=v2;baseUnit=u2;packQty=v1;packUnit=u1}
   packSize=Math.round((baseQty/packQty)*100)/100
 } else if(v1!=null){baseQty=v1;baseUnit=u1}
 else if(v2!=null){baseQty=v2;baseUnit=u2}
 let invalid=baseQty!=null&&(baseQty<0||!Number.isFinite(baseQty));
 let sug=!it&&!dup&&!amb?[...items].sort((a,b)=>similarity(raw,b.name)-similarity(raw,a.name))[0]:null;
 let susp=it&&baseQty!=null&&latest[it.id]&&Math.abs(baseQty-num(latest[it.id].qty))>Math.max(20,Math.abs(num(latest[it.id].qty))*.5);
 p.push({raw,it,dup,amb,baseQty,baseUnit,packQty,packUnit,packSize,invalid,sug,susp})
}
let updateExisting=p.filter(x=>x.it&&!x.invalid);
let createWithQty=p.filter(x=>!x.it&&!x.dup&&!x.amb&&!x.invalid&&x.baseQty!=null);
let createNoQty=p.filter(x=>!x.it&&!x.dup&&!x.amb&&!x.invalid&&x.baseQty==null);
let needsAttention=p.filter(x=>x.dup||x.amb||x.invalid);
$("#mr").innerHTML=`<p><span class="status-chip good-bg">${updateExisting.length} will update stock</span> <span class="status-chip warn-bg">${createWithQty.length} new items with stock</span> <span class="status-chip">${createNoQty.length} new items, no stock yet</span> ${needsAttention.length?`<span class="status-chip bad-bg">${needsAttention.length} needs attention</span>`:""}</p>
<div class="scroll"><table><tr><th>Excel</th><th>Match / Suggestion</th><th>Qty · Unit</th><th>Pack</th><th>Check</th></tr>${p.slice(0,150).map(x=>`<tr><td>${esc(x.raw)}</td><td>${x.it?esc(x.it.name):x.dup?'<span class="bad">Duplicate in file</span>':x.amb?'<span class="bad">Ambiguous alias</span>':`<span class="warn">New item${x.sug?` — maybe ${esc(x.sug.name)}?`:""}</span>`}</td><td>${x.baseQty==null?"—":`${x.baseQty} ${esc(x.baseUnit||"")}`}</td><td>${x.packSize?`1 ${esc(x.packUnit)} = ${x.packSize} ${esc(x.baseUnit)}`:"—"}</td><td>${x.invalid?"Invalid qty ":""}${x.susp?"Large change":""}</td></tr>`).join("")}${p.length>150?`<tr><td colspan="5" class="muted">…and ${p.length-150} more rows (all included on import)</td></tr>`:""}</table></div>
${me.role==="master"?`<button id="commit" style="margin-top:10px">Import (update ${updateExisting.length}, create ${createWithQty.length+createNoQty.length})</button>`:`<button id="commit" style="margin-top:10px">Import — update ${updateExisting.length} existing items</button><p class="muted">${createWithQty.length+createNoQty.length} rows didn't match an existing item. Only Master can create new items from an import — ask Master to review and re-run this file, or add them from Item Master.</p>`}`;
$("#commit").onclick=async()=>{
 $("#commit").disabled=true;$("#commit").textContent="Importing…";
 let created=me.role==="master"?createWithQty.length+createNoQty.length:0;
 let ir=doc(collection(db,"tallyImports"));
 try{
   await setDoc(ir,{createdAt:serverTimestamp(),createdBy:me.uid,rowCount:p.length,matched:updateExisting.length,created,fileName,fileHash:hash,status:"processing"});
 }catch(e){$("#commit").disabled=false;$("#commit").textContent="Import";return alert("Could not start the import: "+(e?.message||e));}
 let ops=[];
 updateExisting.forEach(x=>{ops.push(b=>b.set(doc(db,"stockLatest",x.it.id),{qty:x.baseQty,updatedAt:serverTimestamp(),updatedBy:me.uid,importId:ir.id}));let sr=doc(collection(db,"tallySnapshots"));ops.push(b=>b.set(sr,{itemId:x.it.id,qty:x.baseQty,importId:ir.id,createdAt:serverTimestamp(),createdBy:me.uid}))});
 if(me.role==="master"){
   createWithQty.forEach(x=>{let nr=doc(collection(db,"items"));ops.push(b=>b.set(nr,{name:x.raw,aliases:[],unit:x.baseUnit||"",packUnit:x.packUnit||"",packSize:x.packSize||0,sensitive:false,active:true,createdAt:serverTimestamp(),createdBy:me.uid,source:"tally_import"}));ops.push(b=>b.set(doc(db,"stockLatest",nr.id),{qty:x.baseQty,updatedAt:serverTimestamp(),updatedBy:me.uid,importId:ir.id}));let sr=doc(collection(db,"tallySnapshots"));ops.push(b=>b.set(sr,{itemId:nr.id,qty:x.baseQty,importId:ir.id,createdAt:serverTimestamp(),createdBy:me.uid}))});
   createNoQty.forEach(x=>{let nr=doc(collection(db,"items"));ops.push(b=>b.set(nr,{name:x.raw,aliases:[],unit:"",packUnit:"",packSize:0,sensitive:false,active:true,createdAt:serverTimestamp(),createdBy:me.uid,source:"tally_import"}))})
 }
 try{
   await commitChunks(ops);
   await updateDoc(ir,{status:"completed",completedAt:serverTimestamp()});
   alert(`Import completed. ${updateExisting.length} items updated${created?`, ${created} new items created`:""}.`);
 }catch(e){
   try{await updateDoc(ir,{status:"failed",error:String(e?.message||e)})}catch(e2){}
   alert("Import stopped partway through due to an error: "+(e?.message||e)+"\n\nSome rows may already be saved. Check Item Master and Dashboard, then re-run this same file — it will not be blocked, since this import did not complete.");
 }
 render("tally")
}}
function similarity(a,b){a=a.toLowerCase().replace(/[^a-z0-9]/g,"");b=b.toLowerCase().replace(/[^a-z0-9]/g,"");let s=0;for(let c of new Set(a))if(b.includes(c))s++;return s/Math.max(new Set(a).size,1)}
async function commitChunks(ops,size=220){for(let i=0;i<ops.length;i+=size){let b=writeBatch(db);ops.slice(i,i+size).forEach(fn=>fn(b));await b.commit()}}

async function rollbackImport(importId){if(!confirm("Restore Tally stock from this import snapshot? Current physical counts will not be changed."))return;let snap=await getDocs(query(collection(db,"tallySnapshots"),where("importId","==",importId))),rows=snap.docs.map(d=>d.data());if(!rows.length)return alert("No snapshots found for this import.");let ops=[];rows.forEach(x=>ops.push(b=>b.set(doc(db,"stockLatest",x.itemId),{qty:x.qty,updatedAt:serverTimestamp(),updatedBy:me.uid,restoredFromImportId:importId},{merge:true})));let ar=doc(collection(db,"approvals"));ops.push(b=>b.set(ar,{type:"tally_rollback",importId,items:rows.length,approvedAt:serverTimestamp(),approvedBy:me.uid}));await commitChunks(ops);alert(`Restored ${rows.length} item quantities.`)}

function movement(m){m.innerHTML=`<div class="card"><h3>Stock Ledger Entry</h3><div class="row"><select id="mi"><option value="">— Select item —</option>${items.map(i=>`<option value="${i.id}">${esc(i.name)}</option>`)}</select><select id="ty"><option>IN</option><option>OUT</option></select><input id="mq" type="number" placeholder="Qty"><select id="rs"><option>Purchase</option><option>Sale</option><option>Return</option><option>Damage</option><option>Adjustment</option><option>Other</option></select><input id="ref" placeholder="Bill/Challan/Reference"><button id="ms">Save</button></div></div>
<div class="card"><div class="row">${searchBox("moveSearch",searchQ.movement,"Search ledger by item...")}</div></div>
<div class="card scroll"><table><tr><th>Date</th><th>Item</th><th>Type</th><th>Qty</th><th>Reason</th><th>Ref</th></tr><tbody id="moveRows"></tbody></table></div>`;
let drawRows=()=>{let q=searchQ.movement.trim().toLowerCase(),rows=movements.filter(x=>{if(!q)return true;let n=items.find(i=>i.id===x.itemId)?.name||"";return n.toLowerCase().includes(q)});$("#moveRows").innerHTML=rows.length?rows.map(x=>`<tr><td>${dt(x.createdAt)}</td><td>${esc(items.find(i=>i.id===x.itemId)?.name||"")}</td><td>${x.type}</td><td>${x.qty}</td><td>${esc(x.reason)}</td><td>${esc(x.reference||"")}</td></tr>`).join(""):`<tr><td colspan="6"><div class="empty">${movements.length?"No ledger entries match your search.":"No IN/OUT entries yet."}</div></td></tr>`};
drawRows();$("#moveSearch").oninput=()=>{searchQ.movement=$("#moveSearch").value;drawRows()};
$("#ms").onclick=async()=>{let q=Number($("#mq").value),itemId=$("#mi").value;if(!itemId||!Number.isFinite(q)||q<=0)return alert("Select an item and enter a valid quantity.");await addDoc(collection(db,"movements"),{itemId,type:$("#ty").value,qty:q,reason:$("#rs").value,reference:$("#ref").value.trim(),createdAt:serverTimestamp(),createdBy:me.uid})}}
function varianceView(m){m.innerHTML=`<div class="card"><h3>Variance Investigation & Recount</h3><p class="muted">Request a blind recount without revealing the Tally difference to the counter.</p><div class="row">${searchBox("varSearch",searchQ.variance)}</div></div><div class="card scroll"><table><tr><th>Item</th><th>Variance</th><th>Pattern</th><th>Workflow</th><th>Recount</th></tr><tbody id="varRows"></tbody></table></div>`;
let drawRows=()=>{let bad=items.filter(i=>hasComparison(i.id)&&dif(i.id)!==0&&matchItem(i,searchQ.variance));$("#varRows").innerHTML=bad.length?bad.map(i=>{let v=variances.find(x=>x.itemId===i.id),st=num(actual[i.id]?.varianceStreak),rq=recounts.find(r=>r.itemId===i.id&&r.status==="open");return`<tr><td><b>${esc(i.name)}</b></td><td class="${dif(i.id)<0?"bad":"warn"}">${dif(i.id)}</td><td>${st>=2?`<span class="status-chip bad-bg">Repeated ×${st}</span>`:'<span class="status-chip">New</span>'}</td><td><select id="st_${i.id}"><option ${v?.status==="Investigating"?"selected":""}>Investigating</option><option ${v?.status==="Reason Found"?"selected":""}>Reason Found</option><option ${v?.status==="Adjustment Pending"?"selected":""}>Adjustment Pending</option><option ${v?.status==="Resolved"?"selected":""}>Resolved</option></select><select id="vr_${i.id}">${["Counting Error","Damage","Billing Error","Unrecorded Sale","Purchase Pending","Loss/Theft","Tally Error","Other"].map(r=>`<option ${v?.reason===r?"selected":""}>${r}</option>`).join("")}</select><button data-v="${i.id}">Save</button></td><td>${rq?'<span class="status-chip warn-bg">Pending recount</span>':`<button class="secondary" data-recount="${i.id}">Request Recount</button>`}</td></tr>`}).join(""):`<tr><td colspan="5"><div class="empty">${searchQ.variance?"No variance items match your search.":"No open variances right now."}</div></td></tr>`;
document.querySelectorAll("[data-v]").forEach(btn=>btn.onclick=async()=>{let id=btn.dataset.v,status=$("#st_"+id).value,reason=$("#vr_"+id).value;await setDoc(doc(db,"variances",id),{itemId:id,difference:dif(id),status,reason,updatedAt:serverTimestamp(),updatedBy:me.uid},{merge:true});if(status==="Resolved"&&!variances.find(x=>x.itemId===id&&x.status==="Resolved"))await addDoc(collection(db,"approvals"),{itemId:id,type:"variance_resolution",difference:dif(id),reason,approvedAt:serverTimestamp(),approvedBy:me.uid});alert("Workflow updated")});
document.querySelectorAll("[data-recount]").forEach(btn=>btn.onclick=async()=>{let id=btn.dataset.recount;await addDoc(collection(db,"recountRequests"),{itemId:id,status:"open",requestedAt:serverTimestamp(),requestedBy:me.uid,reason:"Variance verification"});alert("Blind recount requested")})};
drawRows();$("#varSearch").oninput=()=>{searchQ.variance=$("#varSearch").value;drawRows()}}

function localDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function reportRange(){let period=$("#period")?.value||"Weekly",to=$("#to")?.value?new Date($("#to").value+"T23:59:59"):new Date(),from=$("#from")?.value?new Date($("#from").value+"T00:00:00"):new Date(to);if(!$("#from")?.value){if(period==="Weekly")from.setDate(to.getDate()-6);else if(period==="Monthly")from.setDate(to.getDate()-29);else if(period!=="Daily")from.setDate(to.getDate()-6);from.setHours(0,0,0,0)}return{from,to}}
function reportRows(){let {from,to}=reportRange();return items.map(i=>{let mv=movements.filter(x=>x.itemId===i.id&&x.createdAt?.toDate&&x.createdAt.toDate()>=from&&x.createdAt.toDate()<=to),ins=mv.filter(x=>x.type==="IN").reduce((a,x)=>a+num(x.qty),0),outs=mv.filter(x=>x.type==="OUT").reduce((a,x)=>a+num(x.qty),0),t=num(latest[i.id]?.qty),ac=actual[i.id]?.qty==null?"":num(actual[i.id]?.qty);return[i.name,i.unit||"",ins,outs,t,ac,ac===""?"":ac-t,num(actual[i.id]?.varianceStreak)>=2?"YES":"NO",variances.find(x=>x.itemId===i.id)?.reason||""]})}
function reports(m){m.innerHTML=`<div class="card"><h3>Audit Reports</h3><div class="row"><select id="period"><option>Daily</option><option selected>Weekly</option><option>Monthly</option><option>Custom</option></select><input type="date" id="from"><input type="date" id="to"><button id="xlsx">Download Excel</button><button class="secondary" id="pdf">Download PDF</button></div><p class="muted">IN/OUT is filtered by selected date range. Current Tally/Actual closing, variance, repeated variance and investigation reason are included. Downloads always include every item regardless of the search box below.</p></div>
<div class="card"><div class="row">${searchBox("repSearch",searchQ.reports)}</div></div>
<div id="repTable">${table(searchQ.reports)}</div>`;
$("#repSearch").oninput=()=>{searchQ.reports=$("#repSearch").value;$("#repTable").innerHTML=table(searchQ.reports)};
$("#xlsx").onclick=()=>{if($("#period").value==="Custom"&&(!$("#from").value||!$("#to").value))return alert("Select both From and To dates for a custom report.");if($("#from").value&&$("#to").value&&$("#from").value>$("#to").value)return alert("From date cannot be after To date.");let rows=reportRows(),{from,to}=reportRange(),data=[["Item","Unit","IN","OUT","Current Tally","Current Actual","Current Variance","Repeated Variance","Reason"],...rows],ws=XLSX.utils.aoa_to_sheet(data),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Inventory Report");XLSX.writeFile(wb,`inventory-${localDate(from)}-to-${localDate(to)}.xlsx`)};
$("#pdf").onclick=()=>{if($("#period").value==="Custom"&&(!$("#from").value||!$("#to").value))return alert("Select both From and To dates for a custom report.");if($("#from").value&&$("#to").value&&$("#from").value>$("#to").value)return alert("From date cannot be after To date.");let rows=reportRows(),{from,to}=reportRange(),J=window.jspdf?.jsPDF;if(!J)return alert("PDF library not loaded.");let d=new J({orientation:"landscape"});d.setFontSize(17);d.text("StockSync Pro - Inventory Audit Report",14,15);d.setFontSize(9);d.text(`${from.toLocaleDateString()} to ${to.toLocaleDateString()}`,14,21);d.autoTable({startY:26,head:[["Item","Unit","IN","OUT","Current Tally","Current Actual","Variance","Repeat","Reason"]],body:rows,styles:{fontSize:7.5,cellPadding:2.2},headStyles:{fillColor:[53,103,246]}});d.save(`inventory-${localDate(from)}-to-${localDate(to)}.pdf`)}}
async function users(m){
 const snap=await getDocs(collection(db,"users"));
 const docs=snap.docs.map(d=>({id:d.id,...d.data()}));
 m.innerHTML=`<div class="card"><h3>User Access Management</h3><p class="muted">Master can create users, edit their name/role, disable access, or remove their app profile. Master always has complete app access.</p><div class="row"><input id="newName" placeholder="User name"><input id="newPin" type="password" inputmode="numeric" maxlength="12" placeholder="6–12 digit PIN"><select id="newRole"><option value="actual">Actual Stock User</option><option value="tally">Tally Upload User</option><option value="master">Master</option></select><button id="createUser">Create User</button></div><p id="userMsg" class="muted"></p></div><div class="card"><h3>Users & Rights</h3><div class="scroll"><table><tr><th>Name</th><th>Role</th><th>Status</th><th>Actions</th></tr>${docs.map(x=>`<tr><td><b>${esc(x.displayName||x.username||"")}</b><div class="muted">Login: ${esc(x.username||"")}</div>${x.id===me.uid?'<div class="muted">Current Master</div>':""}</td><td><span class="status-chip ${x.role==="master"?"good-bg":""}">${esc(x.role||"")}</span></td><td>${x.active!==false?'<span class="status-chip good-bg">Active</span>':'<span class="status-chip bad-bg">Disabled</span>'}</td><td><div class="row"><button class="secondary" data-user-edit="${x.id}">Edit</button>${x.id!==me.uid?(x.deleted?`<span class="status-chip bad-bg">Deleted</span>`:`<button class="secondary" data-user-toggle="${x.id}">${x.active!==false?"Disable":"Enable"}</button><button class="danger-soft" data-user-delete="${x.id}">Delete</button>`):'<span class="muted">Protected</span>'}</div></td></tr>`).join("")}</table></div></div><div id="userEditor"></div>`;
 $("#createUser").onclick=async()=>{
   const name=$("#newName").value.trim(),pin=$("#newPin").value.trim(),role=$("#newRole").value,id=loginIdFromName(name),msg=$("#userMsg");
   if(!id)return msg.textContent="Enter a valid user name."; if(!/^\d{6,12}$/.test(pin))return msg.textContent="PIN must be 6–12 digits.";
   $("#createUser").disabled=true; msg.textContent="Creating user…"; let secondary=null,secondaryAuth=null;
   try{secondary=initializeApp(firebaseConfig,"userCreator-"+Date.now());secondaryAuth=getAuth(secondary);const cred=await createUserWithEmailAndPassword(secondaryAuth,id+"@inventory.local",pin);await setDoc(doc(db,"users",cred.user.uid),{username:id,displayName:name,role,active:true,createdAt:serverTimestamp(),createdBy:me.uid});await addDoc(collection(db,"userAudit"),{targetUid:cred.user.uid,action:"created",role,displayName:name,createdAt:serverTimestamp(),createdBy:me.uid});await signOut(secondaryAuth);await deleteApp(secondary);msg.innerHTML='<span class="good">Created successfully.</span>';setTimeout(()=>render("users"),700)}
   catch(e){try{if(secondaryAuth)await signOut(secondaryAuth);if(secondary)await deleteApp(secondary)}catch{} msg.textContent=e?.code==="auth/email-already-in-use"?"That user name already exists.":"Could not create user: "+(e?.code||e?.message||"unknown error");$("#createUser").disabled=false}
 };
 document.querySelectorAll("[data-user-edit]").forEach(btn=>btn.onclick=()=>{
   const x=docs.find(v=>v.id===btn.dataset.userEdit); $("#userEditor").innerHTML=`<div class="card"><h3>Edit User</h3><div class="row"><input id="editUserName" value="${esc(x.displayName||x.username||"")}" placeholder="Display name"><select id="editUserRole"><option value="actual" ${x.role==="actual"?"selected":""}>Actual Stock User</option><option value="tally" ${x.role==="tally"?"selected":""}>Tally Upload User</option><option value="master" ${x.role==="master"?"selected":""}>Master — Full Access</option></select><button id="saveUserEdit">Save Changes</button><button class="secondary" id="cancelUserEdit">Cancel</button></div><p class="muted">Display-name edits do not change the hidden login ID.</p></div>`;
   $("#cancelUserEdit").onclick=()=>$("#userEditor").innerHTML="";
   $("#saveUserEdit").onclick=async()=>{const name=$("#editUserName").value.trim(),role=$("#editUserRole").value;if(!name)return alert("Name required");if(x.id===me.uid&&role!=="master")return alert("You cannot remove your own Master role while logged in.");await setDoc(doc(db,"users",x.id),{displayName:name,role,updatedAt:serverTimestamp(),updatedBy:me.uid},{merge:true});await addDoc(collection(db,"userAudit"),{targetUid:x.id,action:"edited",role,displayName:name,createdAt:serverTimestamp(),createdBy:me.uid});render("users")};
 });
 document.querySelectorAll("[data-user-toggle]").forEach(btn=>btn.onclick=async()=>{const x=docs.find(v=>v.id===btn.dataset.userToggle),active=x.active===false;if(!confirm(`${active?"Enable":"Disable"} ${x.displayName||x.username}?`))return;await setDoc(doc(db,"users",x.id),{active,updatedAt:serverTimestamp(),updatedBy:me.uid},{merge:true});await addDoc(collection(db,"userAudit"),{targetUid:x.id,action:active?"enabled":"disabled",createdAt:serverTimestamp(),createdBy:me.uid});render("users")});
 document.querySelectorAll("[data-user-delete]").forEach(btn=>btn.onclick=async()=>{const x=docs.find(v=>v.id===btn.dataset.userDelete);if(!confirm(`Delete/disable ${x.displayName||x.username}? Historical audit records will remain.`))return;await addDoc(collection(db,"userAudit"),{targetUid:x.id,action:"deleted_profile",oldRole:x.role,displayName:x.displayName||x.username,createdAt:serverTimestamp(),createdBy:me.uid});await setDoc(doc(db,"users",x.id),{active:false,deleted:true,deletedAt:serverTimestamp(),deletedBy:me.uid},{merge:true});render("users")});
}

onAuthStateChanged(auth,async u=>{
 if(!u){if(await isBootstrapped())return login();return firstSetup();}
 try{await profile(u);shell();sub()}catch{await signOut(auth);login("Inactive or missing profile")}
});
if("serviceWorker"in navigator){
 navigator.serviceWorker.register("./sw.js").then(r=>r.update()).catch(e=>console.warn("Service worker:",e));
}
</script></body></html>
