document.querySelectorAll("[data-reverse]").forEach(btn=>btn.onclick=async()=>{if(btn.disabled)return;let orig=movements.find(x=>x.id===btn.dataset.reverse);if(!orig)return;let itemName=items.find(i=>i.id===orig.itemId)?.name||"this item";let reason=prompt(`Reversing ${orig.type} of ${orig.qty} for "${itemName}". Enter a reason:`);if(reason==null||!reason.trim())return;btn.disabled=true;
try{await setDoc(doc(db,"movements","rev_"+orig.id),{itemId:orig.itemId,type:orig.type==="IN"?"OUT":"IN",qty:num(orig.qty),reason:"Reversal: "+reason.trim(),reference:`Reverses entry from ${dt(orig.createdAt)}`,reversalOf:orig.id,createdAt:serverTimestamp(),createdBy:me.uid,createdByName:me.displayName||me.username});alert("Reversal entry saved.")}
catch(e){alert("Could not save the reversal — this entry may have just been reversed by someone else. Refresh and check before trying again.");btn.disabled=false}})};

$("#ms").onclick=async()=>{let btn=$("#ms");if(btn.disabled)return;let q=Number($("#mq").value),itemId=$("#mi").value,ty=$("#ty").value;if(!itemId||!Number.isFinite(q)||q<=0)return alert("Select an item and enter a valid quantity.");
let known=knownQty(itemId);

function varianceView(m){m.innerHTML=`<div class="card"><h3>Variance Investigation & Recount</h3><p class="muted">Request a blind recount without revealing the Tally difference to the counter.</p><div class="row">${searchBox("varSearch",searchQ.variance)}</div></div><div class="card scroll"><table><tr><th>Item</th><th>Variance</th><th>Pattern</th><th>Workflow</th><th>Recount</th></tr><tbody id="varRows"></tbody></table></div>`;
let drawRows=()=>{let bad=items.filter(i=>hasComparison(i.id)&&dif(i.id)!==0&&matchItem(i,searchQ.variance));$("#varRows").innerHTML=bad.length?bad.map(i=>{let v=variances.find(x=>x.itemId===i.id),workflowStale=v&&tsMs(actual[i.id]?.updatedAt)>tsMs(v.updatedAt),effectiveStatus=workflowStale?"Investigating":v?.status||"Investigating",effectiveReason=workflowStale?"":v?.reason||"",st=num(actual[i.id]?.varianceStreak),rq=recounts.find(r=>r.itemId===i.id&&r.status==="open");return`<tr><td><b>${esc(i.name)}</b></td><td class="${dif(i.id)<0?"bad":"warn"}">${dif(i.id)}</td><td>${num(latest[i.id]?.qty)===0&&num(actual[i.id]?.qty)>0?'<span class="status-chip warn-bg">Tally 0 · physical stock found</span> ':num(actual[i.id]?.qty)===0&&num(latest[i.id]?.qty)>0?'<span class="status-chip bad-bg">Physical 0 · Tally stock exists</span> ':""}${st>=2?`<span class="status-chip bad-bg">Repeated ×${st}</span>`:'<span class="status-chip">New</span>'}${workflowStale?' <span class="status-chip warn-bg">New count · workflow reset</span>':""}</td><td><select id="st_${i.id}"><option ${effectiveStatus==="Investigating"?"selected":""}>Investigating</option><option ${effectiveStatus==="Reason Found"?"selected":""}>Reason Found</option><option ${effectiveStatus==="Adjustment Pending"?"selected":""}>Adjustment Pending</option><option ${effectiveStatus==="Resolved"?"selected":""}>Resolved</option></select><select id="vr_${i.id}"><option value="">— Select reason —</option>${["Counting Error","Damage","Billing Error","Unrecorded Sale","Purchase Pending","Loss/Theft","Tally Error","Other"].map(r=>`<option ${effectiveReason===r?"selected":""}>${r}</option>`).join("")}</select><button data-v="${i.id}">Save</button></td><td>${rq?'<span class="status-chip warn-bg">Pending recount</span>':`<button class="secondary" data-recount="${i.id}">Request Recount</button>`}</td></tr>`}).join(""):`<tr><td colspan="5"><div class="empty">${searchQ.variance?"No variance items match your search.":"No open variances righ document.querySelectorAll("[data-v]").forEach(btn=>btn.onclick=async()=>{let id=btn.dataset.v,status=$("#st_"+id).value,reason=$("#vr_"+id).value,current=dif(id),existing=variances.find(x=>x.itemId===id),sameCycle=existing&&tsMs(existing.updatedAt)>=tsMs(actual[id]?.updatedAt),alreadyResolved=sameCycle&&existing.status==="Resolved"&&roundQty(num(existing.difference))===roundQty(current);if((status==="Reason Found"||status==="Resolved")&&!reason)return alert("Select an investigation reason before saving this status.");btn.disabled=true;try{let b=writeBatch(db);b.set(doc(db,"variances",id),{itemId:id,difference:current,status,reason,updatedAt:serverTimestamp(),updatedBy:me.uid},{merge:true});if(status==="Resolved"&&!alreadyResolved){let ar=doc(collection(db,"approvals"));b.set(ar,{itemId:id,type:"variance_resolution",difference:current,reason,approvedAt:serverTimestamp(),approvedBy:me.uid})}await b.commit();alert("Workflow updated")}catch(e){alert("Could not update variance workflow: "+(e?.message||e))}finally{btn.disabled=false}});

drawRows();$("#varSearch").oninput=()=>{searchQ.variance=$("#varSearch").value;drawRows()}}

function activityView(m){m.innerHTML=`<div class="card"><h3>Activity Log</h3><p class="muted">Every Tally import, manual IN/OUT, and physical count in one timeline. Search by item to see exactly what happened around it — useful for checking whether a variance is a real mismatch or just stock that moved between when it was Tally-imported and when it was physically counted. Shows the most recent activity — very old history may not appear here.</p><div class="row">${searchBox("activitySearch",searchQ.activity,"Search by item...")}</div></div>
<div class="card scroll"><table><tr><th>When</th><th>Event</th><th>Item</th><th>Details</th><th>By</th></tr><tbody id="activityRows"></tbody></table></div>`;
let drawRows=()=>{let q=searchQ.activity.trim().toLowerCase(),nameOf=id=>items.find(i=>i.id===id)?.name||"";
let rows=[
 ...imports.map(x=>({ts:x.createdAt,kind:"import",itemName:"",detail:`Tally file "${esc(x.fileName||"")}" — ${x.matched||0} updated${x.created?`, ${x.created} created`:""} of ${x.rowCount||0} rows${x.status&&x.status!=="completed"?` (${esc(x.status)})`:""}`,who:x.createdByName})),
 ...movements.map(x=>({ts:x.createdAt,kind:x.type==="IN"?"in":"out",itemName:nameOf(x.itemId),detail:`${x.type} ${x.qty} — ${esc(x.reason||"")}${x.reference?` (${esc(x.reference)})`:""}`,who:x.createdByName})),
 ...actualHist.map(x=>({ts:x.createdAt,kind:"count",itemName:nameOf(x.itemId),detail:`Physically counted: ${x.newQty}${x.oldQty!=null?` (previously ${x.oldQty})`:""}`,who:x.createdByName}))
];

function localDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function reportRange(){let period=$("#period")?.value||"Weekly",to=$("#to")?.value?new Date($("#to").value+"T23:59:59"):new Date(),from=$("#from")?.value?new Date($("#from").value+"T00:00:00"):new Date(to);if(!$("#from")?.value){if(period==="Weekly")from.setDate(to.getDate()-6);else if(period==="Monthly")from.setDate(to.getDate()-29);else if(period!=="Daily")from.setDate(to.getDate()-6);from.setHours(0,0,0,0)}return{from,to}}

async function users(m){

 document.querySelectorAll("[data-user-edit]").forEach(btn=>btn.onclick=()=>{
