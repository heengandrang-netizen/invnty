<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8faff">
<link rel="manifest" href="manifest.json"><title>StockSync Pro v2</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{
 --bg:#f5f7fb;--surface:#ffffff;--surface2:#f9fbff;--surface3:#eef3fb;
 --line:#e4e9f1;--line2:#d7deea;--text:#172033;--muted:#718096;
 --a:#315efb;--a2:#6c4df6;--g:#0e9f6e;--r:#e5485d;--y:#b7791f;
 --shadow:0 12px 34px rgba(28,39,60,.07);--shadow2:0 4px 14px rgba(28,39,60,.06)
}
*{box-sizing:border-box}html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);
 background:linear-gradient(180deg,#f8faff 0,#f5f7fb 380px,#f5f7fb 100%);min-height:100vh}
body:before{content:"";position:fixed;left:0;right:0;top:0;height:280px;pointer-events:none;
 background:radial-gradient(600px 260px at 12% 0%,rgba(49,94,251,.08),transparent 65%),radial-gradient(520px 230px at 90% 0%,rgba(108,77,246,.055),transparent 66%)}
.app{max-width:1480px;margin:auto;padding:22px 24px 56px;position:relative}
.card{background:rgba(255,255,255,.97);border:1px solid var(--line);border-radius:20px;padding:19px;margin-bottom:15px;
 box-shadow:var(--shadow2);transition:box-shadow .18s,border-color .18s,transform .18s}
.card:hover{border-color:#d8dfeb;box-shadow:var(--shadow)}
.card h3{margin:0 0 15px;font-size:16px;letter-spacing:-.018em;color:#202a3e}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grow{flex:1;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px}
button,input,select,textarea{font:inherit;outline:none}
input,select,textarea{min-height:43px;background:#fff;color:var(--text);border:1px solid var(--line2);border-radius:11px;padding:10px 12px;transition:.18s;box-shadow:inset 0 1px 2px rgba(16,24,40,.02)}
input::placeholder,textarea::placeholder{color:#9aa5b5}
input:focus,select:focus,textarea:focus{border-color:#7e98fb;box-shadow:0 0 0 3px rgba(49,94,251,.09)}
button{min-height:41px;border:1px solid transparent;border-radius:11px;padding:9px 14px;background:linear-gradient(135deg,#315efb,#6550e9);
 color:#fff;font-weight:750;cursor:pointer;box-shadow:0 5px 14px rgba(49,94,251,.18);transition:.16s}
button:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgba(49,94,251,.23)}button:active{transform:none}
button.secondary{background:#fff;color:#3e4b63;border-color:var(--line2);box-shadow:none}button.secondary:hover{background:#f8faff;box-shadow:none}
button.danger{background:#e5485d}.good{color:var(--g)}.bad{color:var(--r)}.warn{color:var(--y)}
.brand{font-size:25px;font-weight:900;letter-spacing:-.045em;color:#172033}.brand span{color:#315efb!important}
.muted{color:var(--muted);font-size:12.5px;line-height:1.5}.kpi{font-size:30px;font-weight:900;letter-spacing:-.045em;margin-top:6px;color:#172033}
.grid>.card{min-height:112px;position:relative;overflow:hidden}.grid>.card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(#315efb,#7456e8);opacity:.78}
.grid>.card:after{content:"";position:absolute;width:85px;height:85px;right:-34px;top:-34px;border-radius:50%;background:#f0f4ff}
.pill{display:inline-flex;align-items:center;gap:6px;background:#ecfbf5;color:#087a56;border:1px solid #ccefe2;border-radius:999px;padding:6px 10px;font-size:11.5px;font-weight:750}
.pill:before{content:"";width:7px;height:7px;border-radius:50%;background:#16b77f}
nav{position:sticky;top:8px;z-index:20;display:flex;gap:5px;overflow:auto;margin:15px 0 18px;padding:6px;background:rgba(255,255,255,.92);
 border:1px solid var(--line);border-radius:15px;box-shadow:0 7px 24px rgba(28,39,60,.07);backdrop-filter:blur(16px);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}nav button{white-space:nowrap;min-height:38px;background:transparent;color:#68758c;border:0;box-shadow:none;padding:8px 13px}
nav button:hover{background:#f4f6fb;color:#27344c;box-shadow:none;transform:none}
nav button.active{background:#edf2ff;color:#315efb;border:1px solid #dbe4ff;box-shadow:none}
.scroll{overflow:auto;border:1px solid var(--line);border-radius:13px;background:#fff}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;min-width:650px}
th,td{padding:12px 13px;border-bottom:1px solid #edf0f5;text-align:left;vertical-align:middle}
th{position:sticky;top:0;background:#f7f9fc;color:#718096;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:800;z-index:2}
td{color:#344056}tr:last-child td{border-bottom:0}tbody tr:hover{background:#fafbfe}
.login{max-width:445px;margin:8vh auto;padding:30px;border-radius:24px;box-shadow:0 24px 65px rgba(28,39,60,.11)}
.login:before{content:"";display:block;width:42px;height:5px;border-radius:9px;background:linear-gradient(90deg,#315efb,#7655e8);margin-bottom:20px}
.login .brand{font-size:31px}.login input{width:100%;margin:6px 0;min-height:49px}.login button{min-height:49px}
.bar{height:6px;background:#edf1f7;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#315efb,#7456e8)}
#main{animation:fadeUp .2s ease}@keyframes fadeUp{from{opacity:.25;transform:translateY(4px)}to{opacity:1;transform:none}}
@media(max-width:760px){
 .app{padding:12px 10px 40px}.card{border-radius:16px;padding:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
 .grid>.card{min-height:100px}.kpi{font-size:26px}.brand{font-size:22px}nav{top:5px;margin:11px 0 14px;border-radius:13px}
 nav button{font-size:12px;padding:8px 11px}.row>input,.row>select{flex:1;min-width:140px}.login{margin:5vh 7px;padding:23px}
}
@media(max-width:390px){.grid{grid-template-columns:1fr 1fr}.kpi{font-size:23px}.card{padding:12px}}
</style></head><body><div id="app" class="app"></div>
<script type="module">
import{initializeApp,deleteApp}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import{getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import{getFirestore,collection,doc,getDoc,getDocs,setDoc,addDoc,updateDoc,onSnapshot,query,orderBy,serverTimestamp,writeBatch,limit}from"https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
import{firebaseConfig}from"./firebase-config.js";
const fb=initializeApp(firebaseConfig),auth=getAuth(fb),db=getFirestore(fb),$=s=>document.querySelector(s),app=$("#app");
let me=null,items=[],latest={},actual={},movements=[],sessions=[],variances=[],imports=[];
const tabs={master:["dashboard","items","tally","counts","actual","movement","variance","reports","users"],actual:["actual"],tally:["tally"]};
const L={dashboard:"Dashboard",items:"Items & Aliases",tally:"Tally Upload",counts:"Count Sessions",actual:"Actual Count",movement:"IN / OUT",variance:"Variance",reports:"Reports",users:"Users"};
const esc=(x="")=>String(x).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const dt=v=>{try{return v?.toDate?.().toLocaleString()||"-"}catch{return"-"}}, num=x=>Number(x||0), dif=id=>num(actual[id]?.qty)-num(latest[id]?.qty);

function loginIdFromName(name){
 return name.trim().toLowerCase().normalize("NFKD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9._-]+/g,".").replace(/^\.+|\.+$/g,"");
}
async function isBootstrapped(){
 try{return (await getDoc(doc(db,"system","bootstrap"))).exists()}catch{return true}
}
async function firstSetup(msg=""){
 app.innerHTML=`<div class="login card"><div class="brand">Welcome to StockSync Pro</div>
 <p class="muted" style="margin:8px 0 18px">First-time setup · Create the Master account to continue.</p>
 <input id="setupName" placeholder="Master name" autocomplete="name">
 <input id="setupPin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="12" placeholder="Create PIN">
 <input id="setupPin2" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="12" placeholder="Confirm PIN">
 <button id="setupGo" style="width:100%;margin-top:8px">Create Master & Continue</button>
 <p class="bad">${esc(msg)}</p><p class="muted">This setup is available only until the first Master is created.</p></div>`;
 $("#setupGo").onclick=async()=>{
   let name=$("#setupName").value.trim(),pin=$("#setupPin").value.trim(),pin2=$("#setupPin2").value.trim(),id=loginIdFromName(name);
   if(!id)return firstSetup("Enter a valid Master name");
   if(!/^\d{6,12}$/.test(pin))return firstSetup("Use a 6–12 digit PIN");
   if(pin!==pin2)return firstSetup("PINs do not match");
   $("#setupGo").disabled=true; $("#setupGo").textContent="Creating Master…";
   try{
     if(await isBootstrapped()) return login("Master setup is already complete. Please login.");
     let cred=await createUserWithEmailAndPassword(auth,id+"@inventory.local",pin);
     let b=writeBatch(db);
     b.set(doc(db,"users",cred.user.uid),{username:id,displayName:name,role:"master",active:true,createdAt:serverTimestamp(),createdBy:cred.user.uid});
     b.set(doc(db,"system","bootstrap"),{initialized:true,masterUid:cred.user.uid,createdAt:serverTimestamp()});
     await b.commit();
     // auth state listener will load the new Master profile automatically
   }catch(e){
     try{await signOut(auth)}catch{}
     firstSetup(e?.code==="auth/email-already-in-use"?"This Master name is already in use. Choose another name or login.":"Could not create Master. Ensure Email/Password Authentication and Firestore are enabled, then retry.");
   }
 };
}
function login(msg=""){app.innerHTML=`<div class="login card"><div class="brand">StockSync Pro</div><p class="muted" style="margin:7px 0 18px">Premium Inventory Audit & Reconciliation</p><input id="u" placeholder="Name" autocomplete="username" style="width:100%;margin:5px 0"><input id="p" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="current-password" placeholder="PIN" maxlength="12" style="width:100%;margin:5px 0"><button id="go" style="width:100%;margin-top:8px">Secure Login</button><p class="muted" style="text-align:center;margin:12px 0 0">Enter your name and PIN</p><p class="bad">${esc(msg)}</p></div>`;$("#go").onclick=async()=>{try{let name=$("#u").value.trim().toLowerCase(), pin=$("#p").value.trim();
if(!name||!/^\d{4,12}$/.test(pin))return login("Enter your name and a 4–12 digit PIN");
let loginId=loginIdFromName(name);
if(!loginId)return login("Please enter a valid name");
await signInWithEmailAndPassword(auth,loginId+"@inventory.local",pin)}catch{login("Invalid username or PIN")}}}
async function profile(u){let s=await getDoc(doc(db,"users",u.uid));if(!s.exists()||s.data().active===false)throw 0;me={uid:u.uid,...s.data()}}
function shell(){let a=tabs[me.role]||[];app.innerHTML=`<div class="row" style="padding:4px 2px"><div class="grow"><div class="brand">StockSync Pro <span style="font-size:10px;vertical-align:top;font-weight:800">PREMIUM</span></div><div class="muted">Inventory Control Center · ${esc(me.displayName||me.username)} · ${esc(me.role)}</div></div><span class="pill" id="net">${navigator.onLine?"Synced ✓":"Offline"}</span><button class="secondary" id="out">Logout</button></div><nav>${a.map((x,i)=>`<button data-tab="${x}" class="${i?"":"active"}">${L[x]}</button>`).join("")}</nav><main id="main"></main>`;$("#out").onclick=()=>signOut(auth);document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{document.querySelectorAll("[data-tab]").forEach(x=>x.classList.remove("active"));b.classList.add("active");render(b.dataset.tab)});render(a[0]);}
addEventListener("online",()=>{$("#net")&&($("#net").textContent="Synced ✓")});addEventListener("offline",()=>{$("#net")&&($("#net").textContent="Offline")});
function sub(){onSnapshot(collection(db,"items"),s=>{items=s.docs.map(d=>({id:d.id,...d.data()}));refresh()});onSnapshot(collection(db,"stockLatest"),s=>{latest=Object.fromEntries(s.docs.map(d=>[d.id,d.data()]));refresh()});onSnapshot(collection(db,"actualLatest"),s=>{actual=Object.fromEntries(s.docs.map(d=>[d.id,d.data()]));refresh()});onSnapshot(collection(db,"countSessions"),s=>{sessions=s.docs.map(d=>({id:d.id,...d.data()}));refresh()});if(me.role==="master"){onSnapshot(query(collection(db,"movements"),orderBy("createdAt","desc"),limit(300)),s=>{movements=s.docs.map(d=>({id:d.id,...d.data()}));refresh()});onSnapshot(collection(db,"variances"),s=>{variances=s.docs.map(d=>({id:d.id,...d.data()}));refresh()});onSnapshot(query(collection(db,"tallyImports"),orderBy("createdAt","desc"),limit(100)),s=>{imports=s.docs.map(d=>({id:d.id,...d.data()}));refresh()})}}
function refresh(){let t=document.querySelector("[data-tab].active");if(t)render(t.dataset.tab)}
function table(){return`<div class="card"><h3>Tally vs Actual</h3><div class="scroll"><table><tr><th>Item</th><th>Tally</th><th>Actual</th><th>Variance</th><th>Status</th><th>Last Count</th></tr>${items.map(i=>{let d=dif(i.id);return`<tr><td><b>${esc(i.name)}</b><div class="muted">${esc((i.aliases||[]).join(", "))}</div></td><td>${latest[i.id]?.qty??"-"}</td><td>${actual[i.id]?.qty??"-"}${actual[i.id]?.inputMode&&actual[i.id]?.inputMode!=="base"?`<div class="muted">${actual[i.id].inputMode==="pack"?`${actual[i.id].inputPackQty} ${esc(actual[i.id].packUnit||"pack")}`:`${actual[i.id].inputPackQty} ${esc(actual[i.id].packUnit||"pack")} + ${actual[i.id].inputBaseQty} ${esc(actual[i.id].unit||"unit")}`}</div>`:""}</td><td class="${d<0?"bad":d>0?"warn":"good"}">${d}</td><td>${d===0?"Matched":d<0?"Short":"Excess"}</td><td>${dt(actual[i.id]?.updatedAt)}</td></tr>`}).join("")}</table></div></div>`}
function render(t){let m=$("#main");if(!m)return;if(t==="dashboard"){let repeat=items.filter(i=>num(actual[i.id]?.varianceStreak)>=2).length,un=items.filter(i=>actual[i.id]?.qty==null).length;m.innerHTML=`<div class="grid"><div class="card"><div class="muted">SKUs</div><div class="kpi">${items.length}</div></div><div class="card"><div class="muted">Shortage</div><div class="kpi bad">${items.filter(i=>dif(i.id)<0).length}</div></div><div class="card"><div class="muted">Excess</div><div class="kpi warn">${items.filter(i=>dif(i.id)>0).length}</div></div><div class="card"><div class="muted">Not Counted</div><div class="kpi">${un}</div></div><div class="card"><div class="muted">Repeated Variance</div><div class="kpi bad">${repeat}</div></div></div>${table()}`};if(t==="items")itemsView(m);if(t==="tally")tally(m);if(t==="counts")counts(m);if(t==="actual")actualView(m);if(t==="movement")movement(m);if(t==="variance")varianceView(m);if(t==="reports")reports(m);if(t==="users")users(m)}
function itemsView(m){m.innerHTML=`<div class="card"><h3>Item Master</h3>
<p class="muted">Set the Tally/base unit and, where needed, one packing unit. Example: Base unit = Piece, Packing unit = Carton, 1 Carton = 100 Pieces.</p>
<div class="row"><input id="n" placeholder="Actual name"><input id="a" placeholder="Aliases comma separated">
<input id="unit" placeholder="Tally/Base unit (e.g. Piece)"><input id="packUnit" placeholder="Packing unit (e.g. Carton)">
<input id="packSize" type="number" step="any" min="0" placeholder="Base units / pack (e.g. 100)">
<label><input id="sensitive" type="checkbox"> Sensitive / dual count</label><button id="save">Add</button></div></div>
<div class="card scroll"><table><tr><th>Name</th><th>Aliases</th><th>Tally Unit</th><th>Conversion</th><th>Risk</th></tr>
${items.map(i=>`<tr><td>${esc(i.name)}</td><td>${esc((i.aliases||[]).join(", "))}</td><td>${esc(i.unit||"")}</td>
<td>${i.packUnit&&num(i.packSize)>0?`1 ${esc(i.packUnit)} = ${num(i.packSize)} ${esc(i.unit||"unit")}`:"—"}</td><td>${i.sensitive?"Dual count":"Normal"}</td></tr>`).join("")}</table></div>`;
$("#save").onclick=async()=>{let n=$("#n").value.trim(),ps=Number($("#packSize").value||0),pu=$("#packUnit").value.trim();if(!n)return;
if((pu&&!ps)||(!pu&&ps))return alert("Enter both Packing unit and Base units per pack, or leave both blank.");
await addDoc(collection(db,"items"),{name:n,aliases:$("#a").value.split(",").map(x=>x.trim()).filter(Boolean),unit:$("#unit").value.trim(),
packUnit:pu,packSize:ps>0?ps:0,sensitive:$("#sensitive").checked,active:true,createdAt:serverTimestamp(),createdBy:me.uid})}}

function counts(m){m.innerHTML=`<div class="card"><h3>Physical Count Sessions</h3><div class="row"><input id="sn" placeholder="e.g. Week 38 Count"><button id="new">Start Session</button></div></div><div class="card scroll"><table><tr><th>Session</th><th>Status</th><th>Started</th><th>Action</th></tr>${sessions.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.status)}</td><td>${dt(s.createdAt)}</td><td>${s.status==="open"?`<button data-close="${s.id}">Lock</button>`:`<button class="secondary" data-reopen="${s.id}">Reopen</button>`}</td></tr>`).join("")}</table></div>`;$("#new").onclick=async()=>{if(!$("#sn").value.trim())return;await addDoc(collection(db,"countSessions"),{name:$("#sn").value.trim(),status:"open",createdAt:serverTimestamp(),createdBy:me.uid})};document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>updateDoc(doc(db,"countSessions",b.dataset.close),{status:"locked",lockedAt:serverTimestamp(),lockedBy:me.uid}));document.querySelectorAll("[data-reopen]").forEach(b=>b.onclick=async()=>{let reason=prompt("Reason for reopening?");if(reason)await updateDoc(doc(db,"countSessions",b.dataset.reopen),{status:"open",reopenReason:reason,reopenedAt:serverTimestamp(),reopenedBy:me.uid})})}
function actualView(m){let open=sessions.filter(s=>s.status==="open");m.innerHTML=`<div class="card"><h3>Blind Physical Count</h3>
<p class="muted">Tally quantity remains hidden. You can count in Tally unit, packing unit, or a mix of both; StockSync converts everything to the Tally/base unit before comparison.</p>
<select id="sess">${open.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join("")}</select>
<input id="search" placeholder="Search item..." style="width:100%;margin-top:8px"></div><div id="alist"></div>`;
let draw=()=>{let q=$("#search").value.toLowerCase();$("#alist").innerHTML=items.filter(i=>i.name.toLowerCase().includes(q)).map(i=>{
 let hasPack=i.packUnit&&num(i.packSize)>0, base=esc(i.unit||"Unit"),pack=esc(i.packUnit||"Pack");
 return`<div class="card"><div class="row"><div class="grow"><b>${esc(i.name)}</b>
 <div class="muted">Tally unit: ${base}${hasPack?` • 1 ${pack} = ${num(i.packSize)} ${base}`:""} ${i.sensitive?"• Dual verification":""}</div></div></div>
 ${hasPack?`<div class="row" style="margin-top:10px">
 <select id="mode_${i.id}" data-mode="${i.id}"><option value="base">${base}</option><option value="pack">${pack}</option><option value="mixed">${pack} + ${base}</option></select>
 <div id="entry_${i.id}" class="row grow"></div><div id="calc_${i.id}" class="muted"></div>
 <button data-count="${i.id}">Save Count</button></div>`:
 `<div class="row" style="margin-top:10px"><input id="base_${i.id}" type="number" step="any" min="0" placeholder="${base} quantity"><div id="calc_${i.id}" class="muted"></div><button data-count="${i.id}">Save Count</button></div>`}</div>`}).join("");
 document.querySelectorAll("[data-mode]").forEach(sel=>{sel.onchange=()=>drawUnitEntry(sel.dataset.mode);drawUnitEntry(sel.dataset.mode)});
 document.querySelectorAll("[data-count]").forEach(btn=>btn.onclick=()=>saveCount(btn.dataset.count))
};$("#search").oninput=draw;draw()}
function drawUnitEntry(id){
 let i=items.find(x=>x.id===id),mode=$("#mode_"+id)?.value,box=$("#entry_"+id);if(!i||!box)return;
 let base=esc(i.unit||"Unit"),pack=esc(i.packUnit||"Pack");
 box.innerHTML=mode==="base"?`<input id="base_${id}" type="number" step="any" min="0" placeholder="${base} quantity">`:
 mode==="pack"?`<input id="pack_${id}" type="number" step="any" min="0" placeholder="${pack} quantity">`:
 `<input id="pack_${id}" type="number" step="1" min="0" placeholder="${pack}"><span>+</span><input id="base_${id}" type="number" step="any" min="0" placeholder="${base}">`;
 box.querySelectorAll("input").forEach(x=>x.oninput=()=>previewUnitCount(id));previewUnitCount(id)
}
function countToBase(id){
 let i=items.find(x=>x.id===id),has=i?.packUnit&&num(i.packSize)>0,mode=$("#mode_"+id)?.value||"base";
 let base=Number($("#base_"+id)?.value||0),pack=Number($("#pack_"+id)?.value||0);
 if(base<0||pack<0||!Number.isFinite(base)||!Number.isFinite(pack))return null;
 let qty=has?(mode==="base"?base:mode==="pack"?pack*num(i.packSize):pack*num(i.packSize)+base):base;
 return{qty,mode,baseQty:base,packQty:pack,packSize:num(i?.packSize),unit:i?.unit||"",packUnit:i?.packUnit||""}
}
function previewUnitCount(id){let c=countToBase(id),el=$("#calc_"+id);if(!el||!c)return;el.innerHTML=`Calculated: <b>${c.qty}</b> ${esc(c.unit||"unit")}`}
async function saveCount(id){let sess=$("#sess")?.value,c=countToBase(id),qty=c?.qty;if(!sess||!c||!Number.isFinite(qty))return alert("Open session and valid quantity required");
let item=items.find(x=>x.id===id),countRef=doc(collection(db,"countEntries"));
await setDoc(countRef,{sessionId:sess,itemId:id,qty,inputMode:c.mode,inputBaseQty:c.baseQty,inputPackQty:c.packQty,packSize:c.packSize,unit:c.unit,packUnit:c.packUnit,createdAt:serverTimestamp(),createdBy:me.uid});
if(item.sensitive){let snap=await getDocs(query(collection(db,"countEntries")));let prior=snap.docs.map(d=>d.data()).filter(x=>x.sessionId===sess&&x.itemId===id&&x.createdBy!==me.uid);
if(!prior.length)return alert("First blind count saved. A second user must verify this sensitive item.");let other=prior[prior.length-1];if(num(other.qty)!==qty)return alert("Dual count mismatch. Master review required.");}
let old=num(actual[id]?.qty),streak=(latest[id]&&qty-num(latest[id].qty)!==0)?num(actual[id]?.varianceStreak)+1:0;
await setDoc(doc(db,"actualLatest",id),{qty,inputMode:c.mode,inputBaseQty:c.baseQty,inputPackQty:c.packQty,packSize:c.packSize,unit:c.unit,packUnit:c.packUnit,sessionId:sess,updatedAt:serverTimestamp(),updatedBy:me.uid,varianceStreak:streak});
await addDoc(collection(db,"actualHistory"),{itemId:id,sessionId:sess,oldQty:old,newQty:qty,inputMode:c.mode,inputBaseQty:c.baseQty,inputPackQty:c.packQty,packSize:c.packSize,unit:c.unit,packUnit:c.packUnit,createdAt:serverTimestamp(),createdBy:me.uid});
alert(`Count saved: ${qty} ${c.unit||"unit"}`)}

function tally(m){m.innerHTML=`<div class="card"><h3>Tally Excel Upload</h3><p class="muted">Preview validates aliases, duplicate names, negative/invalid quantities and suspicious changes. Imported snapshots are retained.</p><input id="f" type="file" accept=".xlsx,.xls,.csv"><div id="pv"></div></div><div class="card"><h3>Import History</h3>${imports.slice(0,10).map(x=>`<div>${dt(x.createdAt)} • ${x.matched||0}/${x.rowCount||0} matched • ${esc(x.fileName||"")}</div>`).join("")||'<span class="muted">No imports</span>'}</div>`;$("#f").onchange=async e=>{let file=e.target.files[0],buf=await file.arrayBuffer(),hash=await crypto.subtle.digest("SHA-256",buf),hex=[...new Uint8Array(hash)].map(x=>x.toString(16).padStart(2,"0")).join(""),wb=XLSX.read(buf),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:""});if(imports.some(x=>x.fileHash===hex))return $("#pv").innerHTML='<p class="bad">This exact file was already imported.</p>';let cols=Object.keys(rows[0]||{});$("#pv").innerHTML=`<div class="row"><select id="nc">${cols.map(c=>`<option>${esc(c)}</option>`)}</select><select id="qc">${cols.map(c=>`<option>${esc(c)}</option>`)}</select><button id="match">Preview</button></div><div id="mr"></div>`;$("#match").onclick=()=>match(rows,file.name,hex)}}
function similarity(a,b){a=a.toLowerCase().replace(/[^a-z0-9]/g,"");b=b.toLowerCase().replace(/[^a-z0-9]/g,"");let s=0;for(let c of new Set(a))if(b.includes(c))s++;return s/Math.max(new Set(a).size,1)}
function match(rows,fileName,hash){let nc=$("#nc").value,qc=$("#qc").value,norm=x=>String(x).trim().toLowerCase(),map=new Map();items.forEach(i=>[i.name,...(i.aliases||[])].forEach(a=>map.set(norm(a),i)));let seen=new Set(),p=rows.map(r=>{let raw=String(r[nc]).trim(),q=Number(r[qc]),it=map.get(norm(raw)),dup=seen.has(norm(raw));seen.add(norm(raw));let sug=!it?[...items].sort((a,b)=>similarity(raw,b.name)-similarity(raw,a.name))[0]:null,susp=it&&latest[it.id]&&Math.abs(q-num(latest[it.id].qty))>Math.max(20,Math.abs(num(latest[it.id].qty))*.5);return{raw,q,it,dup,sug,susp}}),ok=p.filter(x=>x.it&&Number.isFinite(x.q)&&x.q>=0&&!x.dup);$("#mr").innerHTML=`<p>${ok.length} valid • ${p.length-ok.length} needs attention</p><div class="scroll"><table><tr><th>Excel</th><th>Match / Suggestion</th><th>Qty</th><th>Check</th></tr>${p.slice(0,150).map(x=>`<tr><td>${esc(x.raw)}</td><td>${x.it?esc(x.it.name):`<span class="warn">Maybe: ${esc(x.sug?.name||"-")}</span>`}</td><td>${x.q}</td><td>${x.dup?"Duplicate ": ""}${x.q<0||!Number.isFinite(x.q)?"Invalid ": ""}${x.susp?"Large change":""}</td></tr>`).join("")}</table></div><button id="commit">Import Valid Rows</button>`;$("#commit").onclick=async()=>{let b=writeBatch(db),ir=doc(collection(db,"tallyImports"));b.set(ir,{createdAt:serverTimestamp(),createdBy:me.uid,rowCount:rows.length,matched:ok.length,fileName,fileHash:hash});ok.forEach(x=>{b.set(doc(db,"stockLatest",x.it.id),{qty:x.q,updatedAt:serverTimestamp(),updatedBy:me.uid,importId:ir.id});let sr=doc(collection(db,"tallySnapshots"));b.set(sr,{itemId:x.it.id,qty:x.q,importId:ir.id,createdAt:serverTimestamp(),createdBy:me.uid})});await b.commit();alert("Import completed with snapshot history")}}
function movement(m){m.innerHTML=`<div class="card"><h3>Stock Ledger Entry</h3><div class="row"><select id="mi">${items.map(i=>`<option value="${i.id}">${esc(i.name)}</option>`)}</select><select id="ty"><option>IN</option><option>OUT</option></select><input id="mq" type="number" placeholder="Qty"><select id="rs"><option>Purchase</option><option>Sale</option><option>Return</option><option>Damage</option><option>Adjustment</option><option>Other</option></select><input id="ref" placeholder="Bill/Challan/Reference"><button id="ms">Save</button></div></div><div class="card scroll"><table><tr><th>Date</th><th>Item</th><th>Type</th><th>Qty</th><th>Reason</th><th>Ref</th></tr>${movements.map(x=>`<tr><td>${dt(x.createdAt)}</td><td>${esc(items.find(i=>i.id===x.itemId)?.name||"")}</td><td>${x.type}</td><td>${x.qty}</td><td>${esc(x.reason)}</td><td>${esc(x.reference||"")}</td></tr>`).join("")}</table></div>`;$("#ms").onclick=async()=>{let q=Number($("#mq").value);if(q<=0)return;await addDoc(collection(db,"movements"),{itemId:$("#mi").value,type:$("#ty").value,qty:q,reason:$("#rs").value,reference:$("#ref").value.trim(),createdAt:serverTimestamp(),createdBy:me.uid})}}
function varianceView(m){let bad=items.filter(i=>dif(i.id)!==0);m.innerHTML=`<div class="card"><h3>Variance Investigation & Approval</h3><div class="scroll"><table><tr><th>Item</th><th>Variance</th><th>Pattern</th><th>Workflow</th></tr>${bad.map(i=>{let v=variances.find(x=>x.itemId===i.id),st=num(actual[i.id]?.varianceStreak);return`<tr><td>${esc(i.name)}</td><td class="${dif(i.id)<0?"bad":"warn"}">${dif(i.id)}</td><td>${st>=2?`<span class="bad">Repeated ×${st}</span>`:"New"}</td><td><select id="st_${i.id}"><option>Investigating</option><option>Reason Found</option><option>Adjustment Pending</option><option>Resolved</option></select><select id="vr_${i.id}"><option>Counting Error</option><option>Damage</option><option>Billing Error</option><option>Unrecorded Sale</option><option>Purchase Pending</option><option>Loss/Theft</option><option>Tally Error</option><option>Other</option></select><button data-v="${i.id}">Save</button></td></tr>`}).join("")}</table></div></div>`;document.querySelectorAll("[data-v]").forEach(b=>b.onclick=async()=>{let id=b.dataset.v,status=$("#st_"+id).value,reason=$("#vr_"+id).value;await setDoc(doc(db,"variances",id),{itemId:id,difference:dif(id),status,reason,updatedAt:serverTimestamp(),updatedBy:me.uid},{merge:true});if(status==="Resolved")await addDoc(collection(db,"approvals"),{itemId:id,type:"variance_resolution",difference:dif(id),reason,approvedAt:serverTimestamp(),approvedBy:me.uid});alert("Workflow updated")})}
function reports(m){m.innerHTML=`${table()}<div class="card"><h3>Reports</h3><div class="row"><select id="period"><option>Daily</option><option>Weekly</option><option>Monthly</option><option>Custom</option></select><input type="date" id="from"><input type="date" id="to"><button id="csv">Download Excel-compatible CSV</button></div><p class="muted">Includes Tally, physical, variance and repeated-variance indicator.</p></div>`;$("#csv").onclick=()=>{let lines=[["Item","Tally","Actual","Variance","Repeated Variance","Tally Updated","Actual Updated"],...items.map(i=>[i.name,latest[i.id]?.qty??"",actual[i.id]?.qty??"",dif(i.id),num(actual[i.id]?.varianceStreak)>=2?"YES":"NO",dt(latest[i.id]?.updatedAt),dt(actual[i.id]?.updatedAt)])],csv=lines.map(r=>r.map(x=>`"${String(x).replaceAll('"','""')}"`).join(",")).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download=`inventory-${$("#period").value.toLowerCase()}-${new Date().toISOString().slice(0,10)}.csv`;a.click()}}
async function users(m){
 let u=await getDocs(collection(db,"users"));
 m.innerHTML=`<div class="card"><h3>Create User</h3>
 <p class="muted">Master creates the user's Name, PIN and access role. The user only needs those two login details.</p>
 <div class="row"><input id="newName" placeholder="User name"><input id="newPin" type="password" inputmode="numeric" maxlength="12" placeholder="6–12 digit PIN">
 <select id="newRole"><option value="actual">Actual Stock User</option><option value="tally">Tally Upload User</option><option value="master">Master</option></select>
 <button id="createUser">Create User</button></div><p id="userMsg" class="muted"></p></div>
 <div class="card"><h3>Users & Rights</h3><div class="scroll"><table><tr><th>Name</th><th>Role</th><th>Active</th></tr>
 ${u.docs.map(d=>{let x=d.data();return`<tr><td>${esc(x.displayName||x.username||"")}</td><td>${esc(x.role||"")}</td><td>${x.active!==false?"Active":"Disabled"}</td></tr>`}).join("")}</table></div></div>`;
 $("#createUser").onclick=async()=>{
   let name=$("#newName").value.trim(),pin=$("#newPin").value.trim(),role=$("#newRole").value,id=loginIdFromName(name),msg=$("#userMsg");
   if(!id)return msg.textContent="Enter a valid user name.";
   if(!/^\d{6,12}$/.test(pin))return msg.textContent="PIN must be 6–12 digits.";
   $("#createUser").disabled=true;msg.textContent="Creating user…";
   let secondary=null, secondaryAuth=null, cred=null;
   try{
     secondary=initializeApp(firebaseConfig,"userCreator-"+Date.now());
     secondaryAuth=getAuth(secondary);
     cred=await createUserWithEmailAndPassword(secondaryAuth,id+"@inventory.local",pin);
     await setDoc(doc(db,"users",cred.user.uid),{username:id,displayName:name,role,active:true,createdAt:serverTimestamp(),createdBy:me.uid});
     await signOut(secondaryAuth); await deleteApp(secondary);
     msg.innerHTML=`<span class="good">Created successfully.</span> Give the user: Name <b>${esc(name)}</b> and their PIN.`;
     setTimeout(()=>render("users"),1400);
   }catch(e){
     try{if(secondaryAuth)await signOut(secondaryAuth);if(secondary)await deleteApp(secondary)}catch{}
     msg.textContent=e?.code==="auth/email-already-in-use"?"That user name already exists.":"Could not create user: "+(e?.code||"unknown error");
     $("#createUser").disabled=false;
   }
 }
}
onAuthStateChanged(auth,async u=>{
 if(!u){if(await isBootstrapped())return login();return firstSetup();}
 try{await profile(u);shell();sub()}catch{await signOut(auth);login("Inactive or missing profile")}
});
