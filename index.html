function previewTally(grid,fileName,hash){
let nc=$("#nc").value,qc=$("#qc").value,qc2=$("#qc2").value,hasHeader=$("#hasHeader").checked;
if(nc==="")return alert("Select the item name column.");
if(qc==="")return alert("Select the primary quantity column.");
if(nc===qc||(qc2!==""&&(nc===qc2||qc===qc2)))return alert("Item Name, Primary Quantity and Alternate Quantity must each be a different column.");
nc=+nc;qc=+qc;qc2=qc2===""?null:+qc2;
let start=hasHeader?1:0;
let activeItems=items.filter(i=>i.active!==false);
let norm=normKey,map=new Map(),ambiguous=new Set();
activeItems.forEach(i=>[i.name,...(i.aliases||[])].forEach(a=>{let k=norm(a);if(map.has(k)&&map.get(k).id!==i.id)ambiguous.add(k);else map.set(k,i)}));
let seen=new Set(),p=[];
for(let r=start;r<grid.length;r++){
 let row=grid[r],raw=row[nc]?String(row[nc].v).trim():"";
 if(!raw)continue;
 let key=norm(raw),dup=seen.has(key),amb=ambiguous.has(key);
 seen.add(key);
 let it=(dup||amb)?null:map.get(key);
 let c1=row[qc],c2=qc2!=null?row[qc2]:null;
 let v1=c1&&c1.v!==""?parseQtyValue(c1.v):null,v2=c2&&c2.v!==""?parseQtyValue(c2.v):null;
 let u1=c1?c1.unit:"",u2=c2?c2.unit:"";
 let baseQty=null,baseUnit="",packQty=null,packUnit="",packSize=null;
 if(v1!=null&&v2!=null){
   if(v1===0&&v2===0){baseQty=0;baseUnit=u1}
   else if(v1===0){baseQty=v2;baseUnit=u2}
   else if(v2===0){baseQty=v1;baseUnit=u1}
   else if(Math.abs(v1)>=Math.abs(v2)){baseQty=v1;baseUnit=u1;packQty=v2;packUnit=u2;packSize=Math.round((baseQty/packQty)*100)/100}
   else{baseQty=v2;baseUnit=u2;packQty=v1;packUnit=u1;packSize=Math.round((baseQty/packQty)*100)/100}
 } else if(v1!=null){baseQty=v1;baseUnit=u1}
 else if(v2!=null){baseQty=v2;baseUnit=u2}
 let invalid=baseQty!=null&&(baseQty<0||!Number.isFinite(baseQty));
 let noQtyMatch=!!it&&baseQty==null;
 let sug=!it&&!dup&&!amb?activeItems.map(x=>({x,s:similarity(raw,x.name)})).sort((a,b)=>b.s-a.s)[0]:null;
 sug=sug&&sug.s>=0.5?sug.x:null;
 let susp=it&&baseQty!=null&&latest[it.id]&&Math.abs(baseQty-num(latest[it.id].qty))>Math.max(20,Math.abs(num(latest[it.id].qty))*.5);
 let uomMismatch=null;
 if(it&&packSize!=null&&num(it.packSize)>0&&it.packUnit){let diffPct=Math.abs(packSize-num(it.packSize))/num(it.packSize);if(diffPct>0.05)uomMismatch={fileSays:packSize,masterSays:num(it.packSize),unit:it.unit||"unit",packUnit:it.packUnit}}
 p.push({raw,it,dup,amb,baseQty,baseUnit,packQty,packUnit,packSize,invalid,noQtyMatch,sug,susp,uomMismatch,manualMap:null,rememberMap:me.role==="master"})
}
let effIt=x=>x.manualMap||x.it;
function redraw(){
let targetCounts=new Map();p.forEach(x=>{let t=effIt(x);if(t&&!x.dup&&!x.amb&&!x.invalid&&x.baseQty!=null)targetCounts.set(t.id,(targetCounts.get(t.id)||0)+1)});p.forEach(x=>x.targetDup=!!effIt(x)&&targetCounts.get(effIt(x).id)>1);
let updateExisting=p.filter(x=>effIt(x)&&!x.invalid&&x.baseQty!=null&&!x.targetDup);
let createWithQty=p.filter(x=>!effIt(x)&&!x.dup&&!x.amb&&!x.invalid&&x.baseQty!=null);
let createNoQty=p.filter(x=>!effIt(x)&&!x.dup&&!x.amb&&!x.invalid&&x.baseQty==null);
let needsAttention=p.filter(x=>x.dup||x.amb||x.invalid||x.targetDup||(effIt(x)&&x.baseQty==null)||(me.role!=="master"&&!effIt(x)));
let mismatchCount=p.filter(x=>x.uomMismatch&&!x.manualMap).length;
let created=me.role==="master"?createWithQty.length+createNoQty.length:0;
$("#mr").innerHTML=`<p><span class="status-chip good-bg">${updateExisting.length} will update stock</span> <span class="status-chip warn-bg">${createWithQty.length} new items with stock</span> <span class="status-chip">${createNoQty.length} new items, no stock yet</span> ${needsAttention.length?`<span class="status-chip bad-bg">${needsAttention.length} needs attention</span>`:""} ${mismatchCount?`<span class="status-chip warn-bg">${mismatchCount} UOM conversion mismatch</span>`:""}</p>
<div class="scroll"><table><tr><th>Excel</th><th>Match / Map to existing</th><th>Qty · Unit</th><th>Current → New</th><th>Pack</th><th>Check</th></tr>${p.slice(0,150).map((x,idx)=>{let curIt=effIt(x);let diffCell="—";if(curIt&&x.baseQty!=null){let cur=num(latest[curIt.id]?.qty),d=x.baseQty-cur,pct=cur!==0?Math.round((d/cur)*1000)/10:null;diffCell=`${cur} → ${x.baseQty} <span class="${d<0?"bad":d>0?"warn":"good"}">(${d>0?"+":""}${d}${pct!=null?`, ${d>0?"+":""}${pct}%`:""})</span>`}
let matchCell;
if(x.it){matchCell=esc(x.it.name)}
else if(x.dup){matchCell='<span class="bad">Duplicate in file</span>'}
else if(x.amb){matchCell='<span class="bad">Ambiguous alias</span>'}
else{matchCell=`<div><span class="warn">New item${x.sug?` — maybe ${esc(x.sug.name)}?`:""}</span></div>
<select data-map-idx="${idx}" style="margin-top:4px;min-height:34px"><option value="">— Create as new item —</option>${activeItems.map(i=>`<option value="${i.id}" ${x.manualMap?.id===i.id?"selected":""}>${esc(i.name)}</option>`).join("")}</select>
${x.manualMap&&me.role==="master"?`<label class="status-chip" style="margin-top:4px"><input type="checkbox" data-remember-idx="${idx}" ${x.rememberMap?"checked":""}> Remember this mapping</label>`:x.manualMap?'<div class="muted">Mapped for this import only · Master can save aliases permanently.</div>':""}`}
let checkCell=`${x.invalid?"Invalid qty ":""}${x.targetDup?"Multiple file rows map to the same SKU — choose unique mappings or fix the source file ":""}${x.susp?"Large change ":""}${x.noQtyMatch?"Matched, but no qty in this row — stock not touched ":""}${x.uomMismatch&&!x.manualMap?`<span class="bad">⚠ File implies 1 ${esc(x.uomMismatch.packUnit)} = ${x.uomMismatch.fileSays} ${esc(x.uomMismatch.unit)}, Item Master says ${x.uomMismatch.masterSays}</span>`:""}`;
return`<tr><td>${esc(x.raw)}</td><td>${matchCell}</td><td>${x.baseQty==null?"—":`${x.baseQty} ${esc(x.baseUnit||"")}`}</td><td>${diffCell}</td><td>${x.packSize?`1 ${esc(x.packUnit)} = ${x.packSize} ${esc(x.baseUnit)}`:"—"}</td><td>${checkCell}</td></tr>`}).join("")}${p.length>150?`<tr><td colspan="6" class="muted">…and ${p.length-150} more rows (all included on import)</td></tr>`:""}</table></div>
${needsAttention.length?`<div class="notice bad-note" style="margin-top:10px"><b>Import blocked:</b> ${needsAttention.length} row${needsAttention.length===1?"":"s"} need attention. Duplicate/ambiguous/invalid rows, multiple rows mapped to one SKU, matched rows without quantity, and unmatched rows for Tally-only users must be resolved before import.</div>`:""}${me.role==="master"?`<button id="commit" style="margin-top:10px" ${needsAttention.length?"disabled":""}>Import (update ${updateExisting.length}, create ${createWithQty.length+createNoQty.length})</button>`:`<button id="commit" style="margin-top:10px" ${needsAttention.length?"disabled":""}>Import — update ${updateExisting.length} existing items</button><p class="muted">${createWithQty.length+createNoQty.length} rows didn't match an existing item. Only Master can create new items from an import — ask Master to review and re-run this file, or add them from Item Master.</p>`}`;
document.querySelectorAll("[data-map-idx]").forEach(sel=>sel.onchange=()=>{let idx=+sel.dataset.mapIdx,val=sel.value;p[idx].manualMap=val?items.find(i=>i.id===val)||null:null;redraw()});
document.querySelectorAll("[data-remember-idx]").forEach(cb=>cb.onchange=()=>{p[+cb.dataset.rememberIdx].rememberMap=cb.checked});
$("#commit").onclick=async()=>{
 if(!navigator.onLine)return alert("Tally import needs an internet connection so the import stays atomic and auditable. You can still preview the file offline.");
 $("#commit").disabled=true;$("#commit").textContent="Importing…";
 let ir=doc(collection(db,"tallyImports"));
 try{
   await setDoc(ir,{createdAt:serverTimestamp(),createdBy:me.uid,createdByName:me.displayName||me.username,rowCount:p.length,matched:updateExisting.length,created,fileName,fileHash:hash,status:"processing",snapshotVersion:2});
 }catch(e){$("#commit").disabled=false;$("#commit").textContent="Import";return alert("Could not start the import: "+(e?.message||e));}
 let groups=[],aliasAdds={};
 updateExisting.forEach(x=>{let target=effIt(x),prev=latest[target.id],g=[b=>b.set(doc(db,"stockLatest",target.id),{qty:x.baseQty,updatedAt:serverTimestamp(),updatedBy:me.uid,importId:ir.id})];let sr=doc(collection(db,"tallySnapshots"));g.push(b=>b.set(sr,{itemId:target.id,previousQty:prev?.qty??null,hadPrevious:prev?.qty!=null,importedQty:x.baseQty,importId:ir.id,snapshotVersion:2,createdAt:serverTimestamp(),createdBy:me.uid}));groups.push(g);
   if(me.role==="master"&&x.manualMap&&x.rememberMap){(aliasAdds[target.id]=aliasAdds[target.id]||new Set()).add(x.raw)}
 });
 Object.entries(aliasAdds).forEach(([itemId,rawNames])=>{let it=items.find(i=>i.id===itemId);if(!it)return;let existing=new Set((it.aliases||[]).map(normKey));let toAdd=[...rawNames].filter(r=>!existing.has(normKey(r)));if(toAdd.length)groups.push([b=>b.set(doc(db,"items",itemId),{aliases:[...(it.aliases||[]),...toAdd]},{merge:true})])});
 if(me.role==="master"){
   createWithQty.forEach(x=>{let nr=doc(collection(db,"items")),g=[b=>b.set(nr,{name:x.raw,aliases:[],unit:x.baseUnit||"",packUnit:x.packUnit||"",packSize:x.packSize||0,sensitive:false,active:true,createdAt:serverTimestamp(),createdBy:me.uid,source:"tally_import"}),b=>b.set(doc(db,"stockLatest",nr.id),{qty:x.baseQty,updatedAt:serverTimestamp(),updatedBy:me.uid,importId:ir.id})];let sr=doc(collection(db,"tallySnapshots"));g.push(b=>b.set(sr,{itemId:nr.id,previousQty:null,hadPrevious:false,importedQty:x.baseQty,importId:ir.id,snapshotVersion:2,createdAt:serverTimestamp(),createdBy:me.uid}));groups.push(g)});
   createNoQty.forEach(x=>{let nr=doc(collection(db,"items"));groups.push([b=>b.set(nr,{name:x.raw,aliases:[],unit:"",packUnit:"",packSize:0,sensitive:false,active:true,createdAt:serverTimestamp(),createdBy:me.uid,source:"tally_import"})])})
 }
 try{

   alert(`Import completed. ${updateExisting.length} items updated${created?`, ${created} new items created`:""}.`);

}}
redraw()}

function similarity(a,b){a=a.toLowerCase().replace(/[^a-z0-9]/g,"");b=b.toLowerCase().replace(/[^a-z0-9]/g,"");let s=0;for(let c of new Set(a))if(b.includes(c))s++;return s/Math.max(new Set(a).size,1)}
async function commitChunks(ops,size=12){for(let i=0;i<ops.length;i+=size){let b=writeBatch(db);ops.slice(i,i+size).forEach(fn=>fn(b));await b.commit()}}
async function commitGroups(groups,maxGroups=4,maxWrites=24){let batch=[],writes=0,groupCount=0;for(let g of groups){if((groupCount>=maxGroups||writes+g.length>maxWrites)&&batch.length){let b=writeBatch(db);batch.forEach(fn=>fn(b));await b.commit();batch=[];writes=0;groupCount=0}batch.push(...g);writes+=g.length;groupCount++}if(batch.length){let b=writeBatch(db);batch.forEach(fn=>fn(b));await b.commit()}}

async function rollbackImport(importId){if(!navigator.onLine)return alert("Restore requires an internet connection so newer Tally stock can be checked safely.");if(!confirm("Restore the quantities that existed immediately before this Tally import? Current physical counts will not be changed. Items created by the import will remain, but their imported stock value will be cleared."))return;let snap=await getDocs(query(collection(db,"tallySnapshots"),where("importId","==",importId))),rows=snap.docs.map(d=>d.data());if(!rows.length)return alert("No snapshots found for this import.");if(rows.some(x=>Number(x.snapshotVersion)<2||typeof x.hadPrevious!=="boolean"))return alert("This is a legacy snapshot that did not store pre-import quantities, so a safe rollback is not possible.");let eligible=[],skipped=0;for(let i=0;i<rows.length;i+=40){let part=rows.slice(i,i+40),live=await Promise.all(part.map(x=>getDoc(doc(db,"stockLatest",x.itemId))));part.forEach((x,j)=>{let cur=live[j];if(cur.exists()&&cur.data().importId===importId)eligible.push(x);else skipped++})}if(!eligible.length)return alert("Nothing was restored because newer stock data has replaced this import. This safety check prevents an old rollback from overwriting newer Tally stock.");let groups=eligible.map(x=>[x.hadPrevious?b=>b.set(doc(db,"stockLatest",x.itemId),{qty:roundQty(num(x.previousQty)),updatedAt:serverTimestamp(),updatedBy:me.uid,restoredFromImportId:importId}):b=>b.delete(doc(db,"stockLatest",x.itemId))]);let ar=doc(collection(db,"approvals"));groups.push([b=>b.set(ar,{type:"tally_rollback",importId,items:eligible.length,skipped,approvedAt:serverTimestamp(),approvedBy:me.uid})]);try{await commitGroups(groups);await updateDoc(doc(db,"tallyImports",importId),{rolledBackAt:serverTimestamp(),rolledBackBy:me.uid,rollbackItems:eligible.length,rollbackSkipped:skipped});alert(`Restored ${eligible.length} item quantities${skipped?`; ${skipped} skipped because newer stock data exists`:""}.`)}catch(e){alert("Restore stopped before it could fully finish: "+(e?.message||e)+"\n\nRe-open Import History and run Restore again. Already-restored rows are automatically skipped, so the retry is safe.")}}

let drawRows=()=>{let bad=items.filter(i=>hasComparison(i.id)&&dif(i.id)!==0&&matchItem(i,searchQ.variance));$("#varRows").innerHTML=bad.length?bad.map(i=>{let v=variances.find(x=>x.itemId===i.id),workflowStale=v&&tsMs(actual[i.id]?.updatedAt)>tsMs(v.updatedAt),effectiveStatus=workflowStale?"Investigating":v?.status||"Investigating",effectiveReason=workflowStale?"":v?.reason||"",st=num(actual[i.id]?.varianceStreak),rq=recounts.find(r=>r.itemId===i.id&&r.status==="open");return`<tr><td><b>${esc(i.name)}</b></td><td class="${dif(i.id)<0?"bad":"warn"}">${dif(i.id)}</td><td>${st>=2?`<span class="status-chip bad-bg">Repeated ×${st}</span>`:'<span class="status-chip">New</span>'}${workflowStale?' <span class="status-chip warn-bg">New count · workflow reset</span>':""}</td><td><select id="st_${i.id}"><option ${effectiveStatus==="Investigating"?"selected":""}>Investigating</option><option ${effectiveStatus==="Reason Found"?"selected":""}>Reason Found</option><option ${effectiveStatus==="Adjustment Pending"?"selected":""}>Adjustment Pending</option><option ${effectiveStatus==="Resolved"?"selected":""}>Resolved</option></select><select id="vr_${i.id}"><option value="">— Select reason —</option>${["Counting Error","Damage","Billing Error","Unrecorded Sale","Purchase Pending","Loss/Theft","Tally Error","Other"].map(r=>`<option ${effectiveReason===r?"selected":""}>${r}</option>`).join("")}</select><button data-v="${i.id}">Save</button></td><td>${rq?'<span class="status-chip warn-bg">Pending recount</span>':`<button class="secondary" data-recount="${i.id}">Request Recount</button>`}</td></tr>`}).join(""):`<tr><td colspan="5"><div class="empty">${searchQ.variance?"No variance items match your search.":"No open variances right now."}</div></td></tr>`;
document.querySelectorAll("[data-v]").forEach(btn=>btn.onclick=async()=>{let id=btn.dataset.v,status=$("#st_"+id).value,reason=$("#vr_"+id).value,current=dif(id),existing=variances.find(x=>x.itemId===id),sameCycle=existing&&tsMs(existing.updatedAt)>=tsMs(actual[id]?.updatedAt),alreadyResolved=sameCycle&&existing.status==="Resolved"&&roundQty(num(existing.difference))===roundQty(current);if((status==="Reason Found"||status==="Resolved")&&!reason)return alert("Select an investigation reason before saving this status.");btn.disabled=true;try{let b=writeBatch(db);b.set(doc(db,"variances",id),{itemId:id,difference:current,status,reason,updatedAt:serverTimestamp(),updatedBy:me.uid},{merge:true});if(status==="Resolved"&&!alreadyResolved){let ar=doc(collection(db,"approvals"));b.set(ar,{itemId:id,type:"variance_resolution",difference:current,reason,approvedAt:serverTimestamp(),approvedBy:me.uid})}await b.commit();alert("Workflow updated")}catch(e){alert("Could not update variance workflow: "+(e?.message||e))}finally{btn.disabled=false}});
document.querySelectorAll("[data-recount]").forEach(btn=>btn.onclick=async()=>{if(btn.disabled)return;let id=btn.dataset.recount;btn.disabled=true;try{await setDoc(doc(db,"recountRequests","recount_"+id),{itemId:id,status:"open",requestedAt:serverTimestamp(),requestedBy:me.uid,reason:"Variance verification"});alert("Blind recount requested")}catch(e){alert("Could not request recount: "+(e?.message||e))}finally{btn.disabled=false}})};
drawRows();$("#varSearch").oninput=()=>{searchQ.variance=$("#varSearch").value;drawRows()}}

function activityView(m){m.innerHTML=`<div class="card"><h3>Activity Log</h3><p class="muted">Every Tally import, manual IN/OUT, and physical count in one timeline. Search by item to see exactly what happened around it — useful for checking whether a variance is a real mismatch or just stock that moved between when it was Tally-imported and when it was physically counted. Shows the most recent activity — very old history may not appear here.</p><div class="row">${searchBox("activitySearch",searchQ.activity,"Search by item...")}</div></div>
<div class="card scroll"><table><tr><th>When</th><th>Event</th><th>Item</th><th>Details</th><th>By</th></tr><tbody id="activityRows"></tbody></table></div>`;
let drawRows=()=>{let q=searchQ.activity.trim().toLowerCase(),nameOf=id=>items.find(i=>i.id===id)?.name||"";
let rows=[
 ...imports.map(x=>({ts:x.createdAt,kind:"import",itemName:"",detail:`Tally file "${esc(x.fileName||"")}" — ${x.matched||0} updated${x.created?`, ${x.created} created`:""} of ${x.rowCount||0} rows${x.status&&x.status!=="completed"?` (${esc(x.status)})`:""}`,who:x.createdByName})),
 ...movements.map(x=>({ts:x.createdAt,kind:x.type==="IN"?"in":"out",itemName:nameOf(x.itemId),detail:`${x.type} ${x.qty} — ${esc(x.reason||"")}${x.reference?` (${esc(x.reference)})`:""}`,who:x.createdByName})),
 ...actualHist.map(x=>({ts:x.createdAt,kind:"count",itemName:nameOf(x.itemId),detail:`Physically counted: ${x.newQty}${x.oldQty!=null?` (previously ${x.oldQty})`:""}`,who:x.createdByName}))
];
if(q)rows=rows.filter(r=>r.itemName.toLowerCase().includes(q)||r.detail.toLowerCase().includes(q));
rows.sort((a,b)=>(b.ts?.toDate?.()?.getTime()||0)-(a.ts?.toDate?.()?.getTime()||0));
let shown=rows.slice(0,200);
$("#activityRows").innerHTML=shown.length?shown.map(r=>{let kindChip={import:'<span class="status-chip">Tally import</span>',in:'<span class="status-chip good-bg">Stock IN</span>',out:'<span class="status-chip bad-bg">Stock OUT</span>',count:'<span class="status-chip warn-bg">Physical count</span>'}[r.kind];return`<tr><td>${dt(r.ts)}</td><td>${kindChip}</td><td><b>${esc(r.itemName)}</b></td><td>${r.detail}</td><td class="muted">${esc(r.who||"—")}</td></tr>`}).join("")+(rows.length>200?`<tr><td colspan="5" class="muted">…${rows.length-200} more not shown, narrow your search</td></tr>`:""):`<tr><td colspan="5"><div class="empty">${q?"No activity matches your search.":"No activity recorded yet."}</div></td></tr>`};
drawRows();$("#activitySearch").oninput=()=>{searchQ.activity=$("#activitySearch").value;drawRows()}}

function localDate(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`}
function reportRange(){let period=$("#period")?.value||"Weekly",to=$("#to")?.value?new Date($("#to").value+"T23:59:59"):new Date(),from=$("#from")?.value?new Date($("#from").value+"T00:00:00"):new Date(to);if(!$("#from")?.value){if(period==="Weekly")from.setDate(to.getDate()-6);else if(period==="Monthly")from.setDate(to.getDate()-29);else if(period!=="Daily")from.setDate(to.getDate()-6);from.setHours(0,0,0,0)}return{from,to}}
async function reportRows(){let {from,to}=reportRange(),snap=await getDocs(query(collection(db,"movements"),where("createdAt",">=",from),where("createdAt","<=",to))),rangeMv=snap.docs.map(d=>d.data());return items.filter(i=>i.active!==false).map(i=>{let mv=rangeMv.filter(x=>x.itemId===i.id),ins=mv.filter(x=>x.type==="IN").reduce((a,x)=>a+num(x.qty),0),outs=mv.filter(x=>x.type==="OUT").reduce((a,x)=>a+num(x.qty),0),t=latest[i.id]?.qty==null?"":num(latest[i.id]?.qty),ac=actual[i.id]?.qty==null?"":num(actual[i.id]?.qty);return[i.name,i.unit||"",ins,outs,t,ac,t===""||ac===""?"":roundQty(ac-t),num(actual[i.id]?.varianceStreak)>=2?"YES":"NO",variances.find(x=>x.itemId===i.id)?.reason||""]})}
function reports(m){m.innerHTML=`<div class="card"><h3>Audit Reports</h3><div class="row"><select id="period"><option>Daily</option><option selected>Weekly</option><option>Monthly</option><option>Custom</option></select><input type="date" id="from"><input type="date" id="to"><button id="xlsx">Download Excel</button><button class="secondary" id="pdf">Download PDF</button></div><p class="muted">IN/OUT is filtered by selected date range. Current Tally/Actual closing, variance, repeated variance and investigation reason are included. Downloads always include every item regardless of the search box below.</p></div>
<div class="card"><div class="row">${searchBox("repSearch",searchQ.reports)}</div></div>
<div id="repTable">${table(searchQ.reports)}</div>`;
$("#repSearch").oninput=()=>{searchQ.reports=$("#repSearch").value;$("#repTable").innerHTML=table(searchQ.reports)};
$("#xlsx").onclick=async()=>{if($("#period").value==="Custom"&&(!$("#from").value||!$("#to").value))return alert("Select both From and To dates for a custom report.");if($("#from").value&&$("#to").value&&$("#from").value>$("#to").value)return alert("From date cannot be after To date.");let btn=$("#xlsx");btn.disabled=true;btn.textContent="Preparing…";try{let rows=await reportRows(),{from,to}=reportRange(),data=[["Item","Unit","IN","OUT","Current Tally","Current Actual","Current Variance","Repeated Variance","Reason"],...rows],ws=XLSX.utils.aoa_to_sheet(data),wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Inventory Report");XLSX.writeFile(wb,`inventory-${localDate(from)}-to-${localDate(to)}.xlsx`)}catch(e){alert("Could not generate the report: "+(e?.message||e))}finally{btn.disabled=false;btn.textContent="Download Excel"}};
$("#pdf").onclick=async()=>{if($("#period").value==="Custom"&&(!$("#from").value||!$("#to").value))return alert("Select both From and To dates for a custom report.");if($("#from").value&&$("#to").value&&$("#from").value>$("#to").value)return alert("From date cannot be after To date.");let btn=$("#pdf");btn.disabled=true;btn.textContent="Preparing…";try{let rows=await reportRows(),{from,to}=reportRange(),J=window.jspdf?.jsPDF;if(!J)return alert("PDF library not loaded.");let d=new J({orientation:"landscape"});d.setFontSize(17);d.text("StockSync Pro - Inventory Audit Report",14,15);d.setFontSize(9);d.text(`${from.toLocaleDateString()} to ${to.toLocaleDateString()}`,14,21);d.autoTable({startY:26,head:[["Item","Unit","IN","OUT","Current Tally","Current Actual","Variance","Repeat","Reason"]],body:rows,styles:{fontSize:7.5,cellPadding:2.2},headStyles:{fillColor:[70,110,94]}});d.save(`inventory-${localDate(from)}-to-${localDate(to)}.pdf`)}catch(e){alert("Could not generate the report: "+(e?.message||e))}finally{btn.disabled=false;btn.textContent="Download PDF"}}}
async function users(m){
 let snap;try{snap=await getDocs(collection(db,"users"))}catch(e){m.innerHTML=`<div class="card"><h3>User Access Management</h3><div class="notice bad-note"><b>Could not load users.</b><br>${esc(e?.message||e)}</div></div>`;return}
 const docs=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(a.displayName||a.username||"").localeCompare(String(b.displayName||b.username||""),undefined,{sensitivity:"base"}));
 m.innerHTML=`<div class="card"><h3>User Access Management</h3><p class="muted">Master can create users, edit their name/role, disable access, or archive their app profile. Master always has complete app access.</p><div class="row"><input id="newName" placeholder="User name"><input id="newPin" type="password" inputmode="numeric" maxlength="12" placeholder="6–12 digit PIN"><select id="newRole"><option value="actual">Actual Stock User</option><option value="tally">Tally Upload User</option><option value="master">Master</option></select><button id="createUser">Create User</button></div><p id="userMsg" class="muted"></p></div><div class="card"><h3>Users & Rights</h3><div class="scroll"><table><tr><th>Name</th><th>Role</th><th>Status</th><th>Actions</th></tr>${docs.map(x=>`<tr><td><b>${esc(x.displayName||x.username||"")}</b><div class="muted">Login: ${esc(x.username||"")}</div>${x.id===me.uid?'<div class="muted">Current Master</div>':""}</td><td><span class="status-chip ${x.role==="master"?"good-bg":""}">${esc(x.role||"")}</span></td><td>${x.active!==false?'<span class="status-chip good-bg">Active</span>':'<span class="status-chip bad-bg">Disabled</span>'}</td><td><div class="row"><button class="secondary" data-user-edit="${x.id}">Edit</button>${x.id!==me.uid?(x.deleted?`<span class="status-chip bad-bg">Deleted</span>`:`<button class="secondary" data-user-toggle="${x.id}">${x.active!==false?"Disable":"Enable"}</button><button class="danger-soft" data-user-delete="${x.id}">Archive</button>`):'<span class="muted">Protected</span>'}</div></td></tr>`).join("")}</table></div></div><div id="userEditor"></div>`;
 $("#createUser").onclick=async()=>{
   const name=$("#newName").value.trim(),pin=$("#newPin").value.trim(),role=$("#newRole").value,id=loginIdFromName(name),msg=$("#userMsg");
   if(!id)return msg.textContent="Enter a valid user name."; if(!/^\d{6,12}$/.test(pin))return msg.textContent="PIN must be 6–12 digits.";
   $("#createUser").disabled=true; msg.textContent="Creating user…"; let secondary=null,secondaryAuth=null,cred=null,profileCommitted=false;
   try{secondary=initializeApp(firebaseConfig,"userCreator-"+Date.now());secondaryAuth=getAuth(secondary);cred=await createUserWithEmailAndPassword(secondaryAuth,id+"@inventory.local",pin);let ar=doc(collection(db,"userAudit")),b=writeBatch(db);b.set(doc(db,"users",cred.user.uid),{username:id,displayName:name,role,active:true,createdAt:serverTimestamp(),createdBy:me.uid});b.set(ar,{targetUid:cred.user.uid,action:"created",role,displayName:name,createdAt:serverTimestamp(),createdBy:me.uid});await b.commit();profileCommitted=true;try{await signOut(secondaryAuth);await deleteApp(secondary)}catch(cleanupErr){console.warn("User creator cleanup warning",cleanupErr)}msg.innerHTML='<span class="good">Created successfully.</span>';setTimeout(()=>render("users"),700)}
   catch(e){if(!profileCommitted){try{if(cred?.user)await deleteUser(cred.user)}catch{}}try{if(secondaryAuth)await signOut(secondaryAuth);if(secondary)await deleteApp(secondary)}catch{} msg.textContent=profileCommitted?"User was created successfully, but temporary setup cleanup reported a warning. Refresh Users to confirm access.":e?.code==="auth/email-already-in-use"?"That user name already exists.":"Could not create user: "+(e?.code||e?.message||"unknown error");$("#createUser").disabled=false}
 };
 document.querySelectorAll("[data-user-edit]").forEach(btn=>btn.onclick=()=>{
   const x=docs.find(v=>v.id===btn.dataset.userEdit); $("#userEditor").innerHTML=`<div class="card"><h3>Edit User</h3><div class="row"><input id="editUserName" value="${esc(x.displayName||x.username||"")}" placeholder="Display name"><select id="editUserRole"><option value="actual" ${x.role==="actual"?"selected":""}>Actual Stock User</option><option value="tally" ${x.role==="tally"?"selected":""}>Tally Upload User</option><option value="master" ${x.role==="master"?"selected":""}>Master — Full Access</option></select><button id="saveUserEdit">Save Changes</button><button class="secondary" id="cancelUserEdit">Cancel</button></div><p class="muted">Display-name edits do not change the hidden login ID.</p></div>`;
   $("#cancelUserEdit").onclick=()=>$("#userEditor").innerHTML="";
   $("#saveUserEdit").onclick=async()=>{const name=$("#editUserName").value.trim(),role=$("#editUserRole").value,btn=$("#saveUserEdit");if(!name)return alert("Name required");if(x.id===me.uid&&role!=="master")return alert("You cannot remove your own Master role while logged in.");btn.disabled=true;try{let ar=doc(collection(db,"userAudit")),b=writeBatch(db);b.set(doc(db,"users",x.id),{displayName:name,role,updatedAt:serverTimestamp(),updatedBy:me.uid},{merge:true});b.set(ar,{targetUid:x.id,action:"edited",role,displayName:name,createdAt:serverTimestamp(),createdBy:me.uid});await b.commit();render("users")}catch(e){alert("Could not update user: "+(e?.message||e));btn.disabled=false}};
 });
 document.querySelectorAll("[data-user-toggle]").forEach(btn=>btn.onclick=async()=>{const x=docs.find(v=>v.id===btn.dataset.userToggle),active=x.active===false;if(!confirm(`${active?"Enable":"Disable"} ${x.displayName||x.username}?`))return;btn.disabled=true;try{let ar=doc(collection(db,"userAudit")),b=writeBatch(db);b.set(doc(db,"users",x.id),{active,updatedAt:serverTimestamp(),updatedBy:me.uid},{merge:true});b.set(ar,{targetUid:x.id,action:active?"enabled":"disabled",createdAt:serverTimestamp(),createdBy:me.uid});await b.commit();render("users")}catch(e){alert("Could not change access: "+(e?.message||e));btn.disabled=false}});
 document.querySelectorAll("[data-user-delete]").forEach(btn=>btn.onclick=async()=>{const x=docs.find(v=>v.id===btn.dataset.userDelete);if(!confirm(`Archive/disable ${x.displayName||x.username}? Historical audit records will remain.`))return;btn.disabled=true;try{let ar=doc(collection(db,"userAudit")),b=writeBatch(db);b.set(ar,{targetUid:x.id,action:"deleted_profile",oldRole:x.role,displayName:x.displayName||x.username,createdAt:serverTimestamp(),createdBy:me.uid});b.set(doc(db,"users",x.id),{active:false,deleted:true,deletedAt:serverTimestamp(),deletedBy:me.uid},{merge:true});await b.commit();render("users")}catch(e){alert("Could not archive user: "+(e?.message||e));btn.disabled=false}});
}

onAuthStateChanged(auth,async u=>{
 if(!u){if(await isBootstrapped())return login();return firstSetup();}
 try{await profile(u);shell();sub()}catch{await signOut(auth);login("Inactive or missing profile")}
});

 navigator.serviceWorker.register("./sw.js").then(r=>r.update()).catch(e=>console.warn("Service worker:",e));
}
